<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UE 2.10 Oncologie — TD interactifs & flashcards</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1c2230; --muted:#5d6678; --line:#dde1ea;
  --accent:#3b5bdb; --accent-ink:#fff; --ok:#1b8a4b; --ok-bg:#e3f6ea; --ko:#c92a2a; --ko-bg:#fde8e8;
  --warn:#b7791f; --warn-bg:#fff4d6; --chip:#eef1f8; --shadow:0 1px 3px rgba(20,30,60,.08),0 6px 18px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151c; --panel:#1b2030; --ink:#e7eaf2; --muted:#9aa3b8; --line:#2c3347;
    --accent:#7c93ff; --accent-ink:#0f1320; --ok:#58d68d; --ok-bg:#16301f; --ko:#ff7b7b; --ko-bg:#3a1a1a;
    --warn:#f0c36b; --warn-bg:#3a2f14; --chip:#252c40; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;flex:1 1 220px}
.bar h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.savebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#savestate{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
nav.tabs{max-width:1100px;margin:0 auto;padding:0 12px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.tabs .sep{flex:0 0 1px;background:var(--line);margin:4px 6px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tab.alt{border-style:dashed}
main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
section.view{display:none}
section.view.on{display:block}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:8px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.good{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
button.bad{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.hero h2{margin:0 0 6px}
.muted{color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat b{font-size:22px}
.progress{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0}
.progress>i{display:block;height:100%;background:var(--accent)}
.setHead{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.setHead h2{margin:0 0 4px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:6px}
.badge.alt{background:var(--warn-bg);color:var(--warn)}
.badge.flag{background:var(--warn-bg);color:var(--warn)}
.q{border-left:4px solid var(--line)}
.q.done-ok{border-left-color:var(--ok)}
.q.done-ko{border-left-color:var(--ko)}
.q .qt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.q .qn{font-weight:700;color:var(--accent)}
.q .qp{margin:0 0 10px}
textarea{width:100%;min-height:84px;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--bg)}
.opt input{margin-top:5px}
.opt .L{font-weight:700;min-width:1.2em}
.opt.sel{border-color:var(--accent)}
.opt.r-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.r-ko{background:var(--ko-bg);border-color:var(--ko)}
.opt.r-miss{border:2px dashed var(--ok)}
.why{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.mark{font-weight:700;margin-left:auto;white-space:nowrap}
.vfrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--bg)}
.vfrow .t{flex:1}
.vfrow .btns{display:flex;gap:4px}
.vfrow .btns button{min-width:38px;padding:4px 8px}
.vfrow .btns button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vfrow.r-ok{background:var(--ok-bg);border-color:var(--ok)}
.vfrow.r-ko{background:var(--ko-bg);border-color:var(--ko)}
table.m{width:100%;border-collapse:collapse;margin:6px 0}
table.m th,table.m td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.m th{background:var(--chip)}
select{font:inherit;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
select.r-ok{border-color:var(--ok);background:var(--ok-bg)}
select.r-ko{border-color:var(--ko);background:var(--ko-bg)}
.corr{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok-bg);border:1px solid var(--ok)}
.corr ul{margin:4px 0 4px 20px;padding:0}
.corr table{border-collapse:collapse;margin:6px 0}
.corr td,.corr th{border:1px solid var(--ok);padding:4px 8px}
.verdict{font-weight:700;margin:8px 0 2px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.flag{background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:14px;margin:8px 0}
/* flashcards */
.fcbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--chip);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{opacity:.8}
.deck{max-width:720px;margin:0 auto}
.flip{perspective:1400px;cursor:pointer;outline:none}
.flip:focus-visible .inner{box-shadow:0 0 0 3px var(--accent)}
.inner{display:grid;transition:transform .5s;transform-style:preserve-3d;position:relative}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:290px;border-radius:18px;border:2px solid var(--line);background:var(--panel);box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg);background:var(--chip)}
.face .tag{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted)}
.face .stat{position:absolute;top:10px;right:14px;font-size:12px;font-weight:700}
.face{position:relative}
.face .qa{font-size:20px;line-height:1.45}
.face.back .qa{font-size:17.5px}
.face .qa ul{margin:6px 0 6px 22px;padding:0;text-align:left}
.face .hint{position:absolute;bottom:10px;width:100%;left:0;text-align:center;font-size:12px;color:var(--muted)}
.st-su .face{border-color:var(--ok)} .st-rev .face{border-color:var(--warn)}
.deckctl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.counter{text-align:center;color:var(--muted);margin:10px 0 2px;font-size:14px}
.sel{min-width:0}
input[type=search],input[type=text]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.tmr{font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:600px){.face{padding:20px 14px;min-height:260px}.face .qa{font-size:18px}.vfrow{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>UE 2.10 Oncologie — révisions<small>TD 1-3, partiel S3, TD alternatifs, flashcards · IFPVPS Toulon</small></h1>
    <div class="savebox">
      <span id="savestate">—</span>
      <button class="sm" id="btnExport" title="Télécharger ta progression en fichier .json">💾 Sauvegarder (fichier)</button>
      <button class="sm" id="btnImport" title="Recharger une sauvegarde .json">📂 Charger</button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"></main>
<script>
/* ===== TD OFFICIELS (contenus issus des PDF fournis) ===== */
const SETS = [];

/* ---------- TD 1 ---------- */
SETS.push({
  id: "td1", title: "TD 1", group: "td",
  sub: "Prévention, dépistage, épidémiologie, facteurs de risque, cancérogenèse",
  obj: "Épidémiologie descriptive et analytique ; incidences et mortalité des cancers en France ; facteurs de risque ; dépistages établis en France ; cours dépistage/prévention, épidémiologie, cancérogenèse.",
  questions: [
    { id: "td1-A", n: "Q A", type: "open", p: "Définissez le terme prévention.",
      a: "Ensemble des mesures visant à éviter ou réduire le nombre et la gravité des maladies, des accidents et des handicaps (OMS)." },
    { id: "td1-B", n: "Q B", type: "open", p: "Explicitez les différents types de prévention.",
      a: "<ul><li><b>Primaire</b> : actions prioritaires qui suppriment ou diminuent les facteurs de risque, donc diminuent l’incidence. But : empêcher l’apparition d’une maladie ; s’adresse aux individus non malades. Ex : information, promotion de la santé en milieu scolaire, vaccination.</li><li><b>Secondaire</b> : suivi de l’état de santé de la population (dépistage). But : déceler le plus tôt possible la maladie, avant les symptômes, pour bloquer son évolution ; s’adresse aux individus non malades ayant des facteurs de risque. Ex : dépistage du cholestérol, de l’HTA, de la glycémie, séances de sevrage tabagique.</li><li><b>Tertiaire</b> : limite les conséquences ou complications d’une maladie. But : ralentir la maladie ; s’adresse aux personnes malades. Ex : rééducation, réadaptation, soutien psychologique, prévention des escarres, traitement anticoagulant après AVC.</li><li><b>Quaternaire</b> : soins palliatifs lorsque la maladie est incurable.</li></ul>" },
    { id: "td1-C", n: "Q C", type: "open", p: "Définissez le terme dépistage.",
      a: "Recherche d’une maladie chez une personne en <b>bonne santé apparente, avant l’apparition des symptômes</b>. Le dépistage peut être individuel ou collectif.<br>Schéma : dépistage → résultat négatif (fin) ou positif → examen complémentaire → résultat négatif ou positif." },
    { id: "td1-D", n: "Q D", type: "open", p: "Citez les 7 critères de qualité d’un dépistage.",
      a: "<ul><li>Repérer au mieux les personnes malades (<b>sensibilité</b>)</li><li>Limiter les explorations complémentaires chez les individus considérés à tort comme malades (<b>spécificité</b>)</li><li><b>Sans danger</b></li><li><b>Simple</b> à réaliser</li><li><b>Reproductible</b></li><li><b>Acceptable</b> pour la population (peu invasif, peu douloureux)</li><li><b>Coût acceptable</b></li></ul>" },
    { id: "td1-E1", n: "Q E", type: "open", p: "Définissez le terme sensibilité et le terme spécificité.",
      a: "<b>Sensibilité</b> : probabilité qu’un test soit + chez les sujets porteurs de la maladie (taux de VP).<br><b>Spécificité</b> : probabilité qu’un test soit – chez les sujets non malades (taux de VN).<ul><li>Plus un test est sensible, moins il y a de FN.</li><li>Plus un test est spécifique, moins il y a de FP.</li></ul><table><tr><th>Test</th><th>Malade</th><th>Non malade</th></tr><tr><td>Test +</td><td>VP</td><td>FP</td></tr><tr><td>Test –</td><td>FN</td><td>VN</td></tr></table>VP : malades test + · VN : sains test – · FP : sains test + · FN : malades test –." },
    { id: "td1-E2", n: "Q E (bis)", type: "open", p: "Définissez les termes facteurs endogènes et facteurs exogènes et, pour chacun, proposez 2 exemples.",
      a: "<b>Endogènes (intrinsèques)</b> : proviennent de l’intérieur de l’organisme. Ex : sexe, âge, facteurs physiologiques, psychologiques, caractéristiques génétiques.<br><b>Exogènes (extrinsèques)</b> : proviennent de l’extérieur. Ex : modes de vie et comportements (alimentation, tabagisme, toxicomanie, alcoolisme, comportements à risque) ; environnement physique et social (habitat, entourage, éducation, milieu scolaire, professionnel, loisirs) ; système de soins." },
    { id: "td1-1", n: "Q 1", type: "open", p: "Définissez l’épidémiologie descriptive.",
      a: "Décrit l’état sanitaire et quantifie l’importance des problèmes de santé." },
    { id: "td1-2", n: "Q 2", type: "open", p: "Définissez l’épidémiologie analytique.",
      a: "Étudie et analyse le rôle des facteurs susceptibles de favoriser la survenue d’une maladie (facteurs de risque)." },
    { id: "td1-3", n: "Q 3", type: "open", p: "Définissez la prévalence.",
      a: "Nombre de cas d’une maladie dans une population <b>à un moment donné</b> (nouveaux cas + anciens cas)." },
    { id: "td1-4", n: "Q 4", type: "open", p: "Définissez l’incidence.",
      a: "Nombre de <b>nouveaux cas</b> d’une maladie pendant une période donnée et dans une population donnée." },
    { id: "td1-5", n: "Q 5", type: "open", p: "5.1 Définissez le RR (risque relatif). 5.2 Que signifie RR = 1 ? 5.3 RR &lt; 1 ? 5.4 RR &gt; 1 ?",
      a: "<b>RR</b> : risque de survenue d’un événement dans un groupe exposé, par rapport à l’autre groupe, non exposé.<ul><li><b>RR = 1</b> : absence de corrélation, l’hypothèse est nulle.</li><li><b>RR &lt; 1</b> : diminution du risque, facteur de protection.</li><li><b>RR &gt; 1</b> : augmentation du risque, existence d’un facteur de risque.</li></ul>" },
    { id: "td1-6", n: "Q 6", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",
      o: [
        { t: "L’incidence du cancer du poumon est plus élevée chez les hommes que chez les femmes.", ok: true },
        { t: "L’incidence du cancer du poumon est plus élevée chez les femmes que chez les hommes.", ok: false },
        { t: "Le cancer de la prostate a l’incidence la plus importante des cancers chez l’homme.", ok: true },
        { t: "Le cancer colorectal a l’incidence la plus importante des cancers chez l’homme.", ok: false, why: "Chez l’homme : prostate, puis poumon, puis colon." },
        { t: "Le cancer du sein a l’incidence la plus importante des cancers chez la femme.", ok: true } ] },
    { id: "td1-7", n: "Q 7", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",
      o: [
        { t: "L’incidence du cancer du poumon a tendance à augmenter chez les hommes.", ok: false, why: "Non retenu à la correction : c’est chez les femmes qu’elle augmente (B)." },
        { t: "L’incidence du cancer du poumon a tendance à augmenter chez les femmes.", ok: true },
        { t: "Le cancer du poumon est le cancer avec le plus fort taux de mortalité chez l’homme.", ok: true },
        { t: "Le cancer du poumon est le cancer avec le plus fort taux de mortalité chez la femme.", ok: false, why: "Chez la femme, la mortalité la plus forte est le cancer du sein (puis poumon, colon)." },
        { t: "Le taux de mortalité concernant les cancers diminue davantage chez les hommes que chez les femmes.", ok: true } ] },
    { id: "td1-8", n: "Q 8", type: "open", p: "Citez un avantage du dépistage.",
      a: "Détecter la maladie à un stade précoce ; traiter précocement pour réduire la mortalité." },
    { id: "td1-9", n: "Q 9", type: "open", p: "Citez 3 facteurs de risque du cancer du sein.",
      a: "<ul><li><b>Âge</b> (+ 50 ans)</li><li><b>Histoire hormonale</b> : ménarche précoce, ménopause tardive, grossesse tardive ou nulliparité, absence d’allaitement, traitement hormonal</li><li><b>Facteurs familiaux</b> : antécédents 1er degré, mutation BRCA 1 ou 2</li><li><b>Facteurs comportementaux</b> : alcool, tabac, sédentarité, surpoids, alimentation, travail de nuit et changements réguliers d’horaires</li></ul>" },
    { id: "td1-10", n: "Q 10", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",
      o: [
        { t: "Le taux de mortalité du cancer de la prostate diminue tous les ans en France.", ok: true },
        { t: "Le taux de survie à 5 ans pour le cancer de la prostate est élevé.", ok: true, why: "93 %." },
        { t: "Le dépistage du cancer de la prostate s’effectue par une prise de sang.", ok: true },
        { t: "Il existe un dépistage national organisé en France pour le cancer de la prostate.", ok: false },
        { t: "Le taux de survie à 5 ans pour le cancer du poumon est élevé.", ok: false, why: "20 %." } ] },
    { id: "td1-11", n: "Q 11", type: "open", p: "Citez 2 facteurs de risque du cancer du poumon.",
      a: "<ul><li><b>Tabac</b> (âge de début, durée, consommation moyenne)</li><li><b>Cannabis</b></li><li><b>Facteurs environnementaux et professionnels</b> : amiante, gaz d’échappement, radon, hydrocarbures, rayonnements ionisants, silice, cadmium</li></ul>" },
    { id: "td1-12", n: "Q 12", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",
      o: [
        { t: "Le cancer colorectal a un taux de survie à 5 ans important s’il est diagnostiqué à un stade précoce.", ok: true, why: "90 %." },
        { t: "Le cancer colorectal a un taux de survie à 5 ans important s’il est diagnostiqué à un stade métastatique.", ok: false },
        { t: "Il existe un dépistage organisé national des cancers colorectaux.", ok: true },
        { t: "Le test immunologique a une sensibilité importante.", ok: true },
        { t: "La coloscopie sera proposée en cas de test immunologique positif.", ok: true } ] },
    { id: "td1-13", n: "Q 13", type: "open", p: "Citez 2 facteurs de risque des cancers colorectaux.",
      a: "<ul><li>Âge (+ 50 ans)</li><li>Antécédents familiaux</li><li>Habitudes de vie : alimentation, surpoids, sédentarité, alcool, tabac</li></ul>" },
    { id: "td1-14", n: "Q 14", type: "open", p: "Citez les 3 facteurs de risque exogènes principaux des cancers.",
      a: "<ol><li><b>Tabac</b></li><li><b>Alcool</b></li><li><b>Alimentation</b></li></ol>" },
    { id: "td1-15", n: "Q 15", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",
      o: [
        { t: "Pour les cancers de la peau, on distingue 80 % de mélanomes et 20 % de carcinomes cutanés.", ok: false, why: "C’est l’inverse : 80 % de carcinomes cutanés, 20 % de mélanomes." },
        { t: "L’incidence des cancers de la peau a beaucoup augmenté en France.", ok: true },
        { t: "83 % des mélanomes seraient dus à l’exposition solaire.", ok: true },
        { t: "Les traitements hormonaux de la ménopause augmentent le risque de cancer du sein.", ok: true },
        { t: "Les pilules œstroprogestatives augmentent le risque de cancer du foie.", ok: true } ] },
    { id: "td1-16", n: "Q 16", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",
      o: [
        { t: "100 % des cancers du col de l’utérus sont dus aux virus HPV.", ok: true },
        { t: "La vaccination anti-HPV est destinée uniquement aux filles.", ok: false },
        { t: "Les populations les moins favorisées sont les moins exposées aux facteurs de cancérogenèse.", ok: false, why: "Non retenu à la correction." },
        { t: "Le virus HPV induit des cancers ORL.", ok: true },
        { t: "40 % des cancers pourraient être évités en changeant des comportements et/ou des habitudes de vie.", ok: true } ] },
    { id: "td1-17", n: "Q 17", type: "open", p: "Explicitez les 4 grandes phases du cycle cellulaire.",
      a: "<ul><li><b>Interphase</b> :<ul><li><b>G1</b> : croissance cellulaire et préparation de la réplication</li><li><b>S</b> : réplication de l’ADN</li><li><b>G2</b> : croissance cellulaire et préparation de la mitose</li></ul></li><li><b>M</b> : mitose (prophase, métaphase, anaphase, télophase)</li></ul>" },
    { id: "td1-18", n: "Q 18", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",
      o: [
        { t: "Il existe des récepteurs de facteur de croissance cellulaire qui peuvent favoriser la croissance des cellules cancéreuses.", ok: true },
        { t: "Les facteurs de croissance peuvent entrer directement dans la cellule afin de réguler les signaux intracellulaires.", ok: false, why: "Ils agissent via un récepteur." },
        { t: "Il existe des mécanismes de réparation de l’ADN très efficaces.", ok: true },
        { t: "Les lésions de l’ADN sont très fréquentes.", ok: true, why: "≈ 40 000 ruptures simple brin de l’ADN par jour." },
        { t: "Les anomalies cellulaires persistantes, après correction, entraînent soit l’apoptose, soit la cancérisation, soit la transmission de maladies héréditaires.", ok: true, why: "Transmission héréditaire si mutation de l’ADN d’une cellule germinale." } ] },
    { id: "td1-19", n: "Q 19", type: "qcm", p: "Entourez la ou les bonne(s) réponse(s).",

  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.v === 1) return Object.assign(blank(), r); }
  catch (e) { memOnly = true; }
  return blank();
}
let S = load();
let saveTimer;
function save() {
  S.saved = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); memOnly = false; } catch (e) { memOnly = true; }
  const el = $("#savestate");
  el.textContent = memOnly ? "⚠ stockage interne indisponible : utilise 💾" : "✓ enregistré";
  clearTimeout(saveTimer); saveTimer = setTimeout(() => { if (!memOnly) el.textContent = "Sauvegarde interne active"; }, 1800);
}
const cardId = i => "c" + i + "_" + CARDS[i][1].replace(/[^a-z0-9]/gi, "").slice(0, 24);

/* ---------- export / import ---------- */
$("#btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ue210-oncologie-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("#btnImport").onclick = () => $("#fileImport").click();
$("#fileImport").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || o.v !== 1 || typeof o.cards !== "object" || typeof o.q !== "object") throw 0;
      if (!confirm("Remplacer ta progression actuelle par celle du fichier ?")) return;
      S = Object.assign(blank(), o); save(); renderAll();
    } catch (err) { alert("Fichier de sauvegarde invalide."); }
  };
  rd.readAsText(f); e.target.value = "";
};

/* ---------- tabs ---------- */

  SETS.filter(s => s.group === "td").map(s => ({ id: s.id, t: s.title })), [{ sep: 1 }],

  [{ id: "cards", t: "🃏 Flashcards" }]);
let cur = "home";

    `<button class="tab ${t.alt ? "alt" : ""}" role="tab" data-tab="${t.id}" aria-selected="${t.id === cur}">${t.t}</button>`).join("");
}
$("#tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); };
function go(id) {
  cur = id; renderTabs();
  $$("section.view").forEach(s => s.classList.toggle("on", s.id === "v-" + id));

/* ---------- question helpers ---------- */
const qst = id => S.q[id] || (S.q[id] = {});
function isOk(q, st) {
  if (q.type === "open") return st.self === "su";
  if (!st.done) return null;
  return st.ok;
}
function setStats(set) {
  let done = 0, ok = 0, pts = 0, tot = 0;
  set.questions.forEach(q => {
    const st = S.q[q.id] || {};
    const fin = q.type === "open" ? !!st.self : !!st.done;
    if (fin) done++;
    const g = isOk(q, st);
    if (g) { ok++; pts += q.pts || 0; }
    tot += q.pts || 0;
  });
  return { done, ok, n: set.questions.length, pts, tot };
}

/* ---------- renderers per type ---------- */
const L = "ABCDEFGH";
function bodyOpen(q, st) {
  return `<textarea data-a="text" placeholder="Ta réponse (facultatif, enregistrée)…">${esc(st.text || "")}</textarea>
  <div class="actions"><button class="primary" data-a="reveal">${st.rev ? "Masquer la correction" : "Voir la correction"}</button></div>
  ${st.rev ? `<div class="corr">${q.a}<div class="actions"><span class="muted">Auto-évaluation :</span>
  <button class="good ${st.self === "su" ? "primary" : ""}" data-a="self" data-v="su">✓ Je savais</button>
  <button class="bad" data-a="self" data-v="rev">↻ À revoir</button>
  ${st.self ? `<span class="muted">(${st.self === "su" ? "su" : "à revoir"})</span>` : ""}</div></div>` : ""}`;
}
function bodyQcm(q, st) {
  const sel = st.a || [];
  return q.o.map((o, i) => {
    let cls = "opt", mark = "";
    if (st.done) {
      const on = sel.includes(i);
      if (o.ok && on) { cls += " r-ok"; mark = "✓"; } else if (!o.ok && on) { cls += " r-ko"; mark = "✗"; } else if (o.ok) { cls += " r-miss"; mark = "← à cocher"; }
    } else if (sel.includes(i)) cls += " sel";
    return `<label class="${cls}"><input type="checkbox" data-a="chk" data-i="${i}" ${sel.includes(i) ? "checked" : ""} ${st.done ? "disabled" : ""}>
    <span class="L">${L[i]}</span><span style="flex:1">${o.t}${st.done && o.why ? `<div class="why">${o.why}</div>` : ""}${st.done && !o.why && o.ok ? "" : ""}</span><span class="mark">${mark}</span></label>`;
  }).join("") + actionsCheck(st);
}
function bodyVf(q, st) {
  const a = st.a || {};
  return q.i.map((o, i) => {
    let cls = "vfrow";
    if (st.done) cls += (a[i] === (o.ok ? "V" : "F")) ? " r-ok" : " r-ko";
    return `<div class="${cls}"><div class="t">${o.t}${st.done ? `<div class="why">${a[i] === (o.ok ? "V" : "F") ? "✓ " : "✗ "}Réponse : <b>${o.ok ? "Vrai" : "Faux"}</b>${o.why ? " — " + o.why : ""}</div>` : ""}</div>
    <div class="btns"><button data-a="vf" data-i="${i}" data-v="V" class="${a[i] === "V" ? "on" : ""}" ${st.done ? "disabled" : ""}>V</button><button data-a="vf" data-i="${i}" data-v="F" class="${a[i] === "F" ? "on" : ""}" ${st.done ? "disabled" : ""}>F</button></div></div>`;
  }).join("") + actionsCheck(st);
}
function bodyOrder(q, st) {
  const a = st.a || {}, n = q.items.length;
  const rows = q.shuffle.map(idx => {
    const ok = st.done && +a[idx] === idx + 1;
    return `<tr><td>${q.items[idx]}</td><td><select data-a="ord" data-i="${idx}" class="${st.done ? (ok ? "r-ok" : "r-ko") : ""}" ${st.done ? "disabled" : ""}>
    <option value="">—</option>${q.items.map((_, k) => `<option value="${k + 1}" ${+a[idx] === k + 1 ? "selected" : ""}>${k + 1}</option>`).join("")}</select>${st.done && !ok ? ` <span class="muted">→ ${idx + 1}</span>` : ""}</td></tr>`;
  }).join("");
  return `<table class="m"><tr><th>Élément</th><th>Rang / ordre</th></tr>${rows}</table>` + actionsCheck(st);
}
function bodyMatch(q, st) {
  const a = st.a || {};
  const head = `<tr><th></th>${q.cols.map(c => `<th>${c}</th>`).join("")}</tr>`;
  const rows = q.rows.map((r, ri) => `<tr><td><b>${r.l}</b></td>${q.cols.map((c, ci) => {
    const v = (a[ri] || [])[ci] || "";
    const ok = st.done && v === r.a[ci];
    return `<td><select data-a="mat" data-r="${ri}" data-c="${ci}" class="${st.done ? (ok ? "r-ok" : "r-ko") : ""}" ${st.done ? "disabled" : ""}>
      <option value="">—</option>${q.ch[ci].map(o => `<option ${v === o ? "selected" : ""}>${o}</option>`).join("")}</select>${st.done && !ok ? `<div class="why">→ ${r.a[ci]}</div>` : ""}</td>`;
  }).join("")}</tr>`).join("");
  return `<table class="m">${head}${rows}</table>` + actionsCheck(st);
}
function actionsCheck(st) {
  if (!st.done) return `<div class="actions"><button class="primary" data-a="check">Valider</button></div>`;
  return `<div class="verdict ${st.ok ? "ok" : "ko"}">${st.ok ? "✓ Tout est juste" : "✗ Des erreurs — regarde les corrections ci-dessus"}${st.n != null ? ` (${st.n} bonne(s) réponse(s) sur ${st.m})` : ""}</div>
  <div class="actions"><button data-a="retry">↻ Refaire</button></div>`;
}
function evaluate(q, st) {
  if (q.type === "qcm") {
    const sel = st.a || []; let g = 0;
    q.o.forEach((o, i) => { if (sel.includes(i) === o.ok) g++; });
    st.n = g; st.m = q.o.length; st.ok = g === q.o.length;
  } else if (q.type === "vf") {
    const a = st.a || {}; let g = 0;
    q.i.forEach((o, i) => { if (a[i] === (o.ok ? "V" : "F")) g++; });
    st.n = g; st.m = q.i.length; st.ok = g === q.i.length;
  } else if (q.type === "order") {
    const a = st.a || {}; let g = 0;
    q.items.forEach((_, i) => { if (+a[i] === i + 1) g++; });
    st.n = g; st.m = q.items.length; st.ok = g === q.items.length;
  } else if (q.type === "match") {
    const a = st.a || {}; let g = 0, m = 0;
    q.rows.forEach((r, ri) => r.a.forEach((x, ci) => { m++; if ((a[ri] || [])[ci] === x) g++; }));
    st.n = g; st.m = m; st.ok = g === m;
  }
  st.done = true;
}
function qHtml(set, q) {
  const st = S.q[q.id] || {};
  const fin = q.type === "open" ? !!st.self : !!st.done;
  const g = isOk(q, st);
  const cls = "card q" + (fin ? (g ? " done-ok" : " done-ko") : "");
  const body = { open: bodyOpen, qcm: bodyQcm, vf: bodyVf, order: bodyOrder, match: bodyMatch }[q.type](q, st);
  const alt = set.group === "alt" ? '<span class="badge alt">variante</span>' : "";
  return `<div class="${cls}" id="q-${q.id}" data-q="${q.id}"><div class="qt"><span class="qn">${q.n}</span>${alt}<span class="badge">${{ open: "question ouverte", qcm: "QCM", vf: "vrai / faux", order: "ordre", match: "tableau" }[q.type]}</span></div>
  <p class="qp">${q.p}</p>${body}</div>`;
}
function setHeadHtml(set) {
  const s = setStats(set);
  const pct = Math.round(100 * s.done / s.n);
  return `<div class="card"><div class="setHead"><div><h2>${set.title}${set.group === "alt" ? ' <span class="badge alt">alternatif</span>' : ""}</h2><div class="muted">${set.sub}</div><p class="muted" style="margin:6px 0 0">${set.obj}</p></div>
  <div style="min-width:220px"><div><b>${s.done}</b>/${s.n} traitées · <b>${s.ok}</b> réussies${s.tot ? ` · <b>${s.pts}</b>/${s.tot} pts` : ""}</div><div class="progress"><i style="width:${pct}%"></i></div>
  <div class="actions" style="margin-top:4px">${set.timer ? `<button class="sm" data-a="timer">⏱ Chrono ${set.timer} min</button><span class="tmr" id="tmr-${set.id}"></span>` : ""}<button class="sm" data-a="resetset">Réinitialiser</button></div></div></div></div>`;
}
function renderSet(set) {
  const v = $("#v-" + set.id);
  v.innerHTML = `<div id="head-${set.id}">${setHeadHtml(set)}</div>` + set.questions.map(q => qHtml(set, q)).join("");
}
function refreshQ(set, q) {
  const old = $("#q-" + q.id); const tmp = document.createElement("div"); tmp.innerHTML = qHtml(set, q);
  old.replaceWith(tmp.firstElementChild);
  $("#head-" + set.id).innerHTML = setHeadHtml(set);
}

/* ---------- events on sets ---------- */
function bindSets() {
  document.addEventListener("input", e => {
    const t = e.target; if (t.dataset.a !== "text") return;
    const qid = t.closest("[data-q]").dataset.q; qst(qid).text = t.value; debounceSave();
  });
  document.addEventListener("change", e => {
    const t = e.target, a = t.dataset.a; if (!a) return;
    const box = t.closest("[data-q]"); if (!box) return;
    const q = findQ(box.dataset.q), st = qst(q.id);
    if (a === "chk") { const s = new Set(st.a || []); t.checked ? s.add(+t.dataset.i) : s.delete(+t.dataset.i); st.a = [...s]; box.querySelectorAll(".opt").forEach((l, i) => l.classList.toggle("sel", (st.a).includes(i))); debounceSave(); }
    if (a === "ord") { st.a = st.a || {}; st.a[t.dataset.i] = t.value; debounceSave(); }
    if (a === "mat") { st.a = st.a || {}; const r = +t.dataset.r; st.a[r] = st.a[r] || []; st.a[r][+t.dataset.c] = t.value; debounceSave(); }
  });
  document.addEventListener("click", e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const a = b.dataset.a;
    if (a === "resetset") { const set = SETS.find(s => $("#v-" + s.id).contains(b)); if (confirm("Réinitialiser toutes les réponses de « " + set.title + " » ?")) { set.questions.forEach(q => delete S.q[q.id]); save(); renderSet(set); } return; }
    if (a === "timer") { const set = SETS.find(s => $("#v-" + s.id).contains(b)); startTimer(set); return; }
    const box = b.closest("[data-q]"); if (!box) return;
    const q = findQ(box.dataset.q), set = SETS.find(s => s.questions.includes(q)), st = qst(q.id);
    if (a === "reveal") st.rev = !st.rev;
    else if (a === "self") st.self = b.dataset.v;
    else if (a === "vf") { st.a = st.a || {}; st.a[b.dataset.i] = b.dataset.v; }
    else if (a === "check") evaluate(q, st);
    else if (a === "retry") { delete st.done; delete st.ok; delete st.a; delete st.n; delete st.m; }
    else return;
    save(); refreshQ(set, q);
  });
}
function findQ(id) { for (const s of SETS) for (const q of s.questions) if (q.id === id) return q; }
let dsT; function debounceSave() { clearTimeout(dsT); dsT = setTimeout(save, 400); }
let tmrI;
function startTimer(set) {
  clearInterval(tmrI); let left = set.timer * 60; const el = $("#tmr-" + set.id);
  const tick = () => { el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); if (left-- <= 0) { clearInterval(tmrI); el.textContent = "⏰ Temps écoulé"; } };
  tick(); tmrI = setInterval(tick, 1000);
}

  const total = CARDS.length, su = CARDS.filter((_, i) => S.cards[cardId(i)] === "su").length, rev = CARDS.filter((_, i) => S.cards[cardId(i)] === "rev").length;

  <h3>TD officiels</h3><div class="grid">${tdSets.map(card).join("")}</div>

document.addEventListener("click", e => { const b = e.target.closest("[data-tab-go]"); if (b) go(b.dataset.tabGo); });

/* ---------- flashcards ---------- */
const F = { themes: new Set(), status: "all", q: "", idx: 0, flipped: false, list: [], seed: 1 };
function shuffled(arr, seed) { const a = arr.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildList() {
  let l = CARDS.map((c, i) => i);
  if (F.themes.size) l = l.filter(i => F.themes.has(CARDS[i][0]));
  if (F.status !== "all") l = l.filter(i => { const s = S.cards[cardId(i)] || "new"; return F.status === "todo" ? s !== "su" : s === F.status; });
  if (F.q) { const q = F.q.toLowerCase(); l = l.filter(i => (CARDS[i][1] + " " + CARDS[i][2]).toLowerCase().includes(q)); }
  if (S.prefs.order === "random") l = shuffled(l, F.seed);
  F.list = l; if (F.idx >= l.length) F.idx = Math.max(0, l.length - 1);
}
function renderCards() {
  buildList();
  const keys = Object.keys(THEMES);
  const chips = keys.map(k => { const idxs = CARDS.map((c, i) => i).filter(i => CARDS[i][0] === k); const su = idxs.filter(i => S.cards[cardId(i)] === "su").length;
    return `<span class="chip ${F.themes.has(k) ? "on" : ""}" data-th="${k}">${THEMES[k]} <small>${su}/${idxs.length}</small></span>`; }).join("");
  const i = F.list[F.idx], c = i != null ? CARDS[i] : null, st = c ? (S.cards[cardId(i)] || "new") : "new";
  const stTxt = { su: '<span style="color:var(--ok)">✓ su</span>', rev: '<span style="color:var(--warn)">↻ à revoir</span>', new: "" }[st];
  $("#v-cards").innerHTML = `<div class="card"><div class="fcbar">
    <input type="search" id="fq" placeholder="Rechercher…" value="${esc(F.q)}">
    <select id="fst"><option value="all">Toutes</option><option value="new">Non vues</option><option value="rev">À revoir seulement</option><option value="su">Sues</option><option value="todo">Non sues (non vues + à revoir)</option></select>
    <select id="ford"><option value="theme">Ordre par thème</option><option value="random">Mélangées</option></select>
    <button class="sm" id="fall">Tous les thèmes</button><button class="sm" id="freset">Réinitialiser statuts</button></div>
    <div class="chips" id="chips">${chips}</div>
    <div class="muted">Aucun thème sélectionné = tous les thèmes. Raccourcis : ← → naviguer · Espace retourner · S su · R à revoir.</div></div>
    ${c ? `<div class="counter">Carte ${F.idx + 1} / ${F.list.length}</div>
    <div class="deck st-${st}"><div class="flip ${F.flipped ? "flipped" : ""}" id="flip" tabindex="0" role="button" aria-label="Retourner la carte">
      <div class="inner"><div class="face front"><span class="tag">${THEMES[c[0]]} · question</span><span class="stat">${stTxt}</span><div class="qa">${c[1]}</div><span class="hint">cliquer pour voir la réponse</span></div>
      <div class="face back"><span class="tag">${THEMES[c[0]]} · réponse</span><span class="stat">${stTxt}</span><div class="qa">${c[2]}</div><span class="hint">cliquer pour revoir la question</span></div></div></div>
      <div class="deckctl"><button id="prev">← Précédente</button><button class="good" id="su">✓ Su</button><button class="bad" id="rev">↻ À revoir</button><button id="next">Suivante →</button></div>
      <div class="deckctl"><label class="muted"><input type="checkbox" id="auto" ${S.prefs.auto ? "checked" : ""}> passer à la suivante après « su / à revoir »</label></div></div>`
      : `<div class="card"><p>Aucune carte pour ce filtre.</p></div>`}`;
  $("#fst").value = F.status; $("#ford").value = S.prefs.order;
}
function fcBind() {
  const v = $("#v-cards");
  v.addEventListener("click", e => {
    const t = e.target;
    if (t.closest("[data-th]")) { const k = t.closest("[data-th]").dataset.th; F.themes.has(k) ? F.themes.delete(k) : F.themes.add(k); F.idx = 0; F.flipped = false; renderCards(); return; }
    if (t.id === "fall") { F.themes.clear(); F.idx = 0; renderCards(); return; }
    if (t.id === "freset") { if (confirm("Remettre toutes les flashcards à « non vue » ?")) { S.cards = {}; save(); renderCards(); } return; }
    if (t.closest("#flip")) { F.flipped = !F.flipped; $("#flip").classList.toggle("flipped", F.flipped); return; }
    if (t.id === "prev") return nav(-1);
    if (t.id === "next") return nav(1);
    if (t.id === "su") return mark("su");
    if (t.id === "rev") return mark("rev");
  });
  v.addEventListener("input", e => { if (e.target.id === "fq") { F.q = e.target.value; F.idx = 0; F.flipped = false; const p = e.target.selectionStart; renderCards(); const n = $("#fq"); n.focus(); n.setSelectionRange(p, p); } });
  v.addEventListener("change", e => {
    if (e.target.id === "fst") { F.status = e.target.value; F.idx = 0; F.flipped = false; renderCards(); }
    if (e.target.id === "ford") { S.prefs.order = e.target.value; F.seed = Date.now() % 10000; F.idx = 0; save(); renderCards(); }
    if (e.target.id === "auto") { S.prefs.auto = e.target.checked; save(); }
  });
  document.addEventListener("keydown", e => {
    if (cur !== "cards" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight") nav(1); else if (e.key === "ArrowLeft") nav(-1);
    else if (e.key === " " || e.key === "Enter") { e.preventDefault(); F.flipped = !F.flipped; const f = $("#flip"); f && f.classList.toggle("flipped", F.flipped); }
    else if (e.key.toLowerCase() === "s") mark("su"); else if (e.key.toLowerCase() === "r") mark("rev");
  });
}
function nav(d) { if (!F.list.length) return; F.idx = (F.idx + d + F.list.length) % F.list.length; F.flipped = false; renderCards(); }
function mark(s) {
  const i = F.list[F.idx]; if (i == null) return;
  S.cards[cardId(i)] = s; save();
  if (S.prefs.auto) {
    buildList();
    if (F.list.length && F.list[F.idx] === i) F.idx = (F.idx + 1) % F.list.length;
  }
  F.flipped = false; renderCards();
}

/* ---------- init ---------- */
function renderAll() { SETS.forEach(renderSet); renderCards(); renderHome(); renderTabs(); }
(function init() {
  const main = $("#main");
  main.innerHTML = ["home", ...SETS.map(s => s.id), "cards"].map(id => `<section class="view" id="v-${id}"></section>`).join("");
  bindSets(); fcBind(); renderAll(); go("home");
  $("#savestate").textContent = memOnly ? "⚠ stockage interne indisponible : utilise 💾" : "Sauvegarde interne active";
})();
</script></body></html>
