      transition: transform var(--transition), box-shadow var(--transition),

    .card-link::before {
      content: ""; position: absolute; inset: -40%; opacity: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(59,130,246,0.18), transparent 60%),
        radial-gradient(circle at 80% 120%, rgba(129,140,248,0.18), transparent 60%);
      transition: opacity var(--transition); z-index: -1;
    }
    .card-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(15,23,42,0.16);
      border-color: rgba(129,140,248,0.7);
      background: #ffffff;

    .card-link:hover::before { opacity: 1; }

    .card-link.pending { opacity: 0.55; cursor: default; pointer-events: none; box-shadow: none; }
    .card-link.pending .card-badge { background: #e5e7eb; color: #6b7280; border-color: #e5e7eb; }

    .card-header { display: flex; justify-content: space-between; gap: 6px; align-items: center; margin-bottom: 6px; }

    .card-title .emoji { font-size: 1.3rem; }
    .card-badge {

    .open-pill {
      border-radius: var(--radius-pill); padding: 2px 10px;
      background: #0f172a; color: #f9fafb; font-size: 0.78rem;

    .card-link.single { max-width: 520px; }

    .decor { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .decor svg { width: 100%; height: 100%; display: block; }

    :root { --bg-grad: radial-gradient(circle at top left, #fce7f3 0, #ede9fe 38%, #fdfcff 100%); --acc: #be185d; --acc-soft: #fbcfe8; }

    .card-link::before { background: radial-gradient(circle at 10% 0%, rgba(236,72,153,0.18), transparent 60%), radial-gradient(circle at 80% 120%, rgba(139,92,246,0.18), transparent 60%); }
    .tag { background: #fdf2f8; color: #9d174d; }
