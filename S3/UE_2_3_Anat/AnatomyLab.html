        ${ed.tool==='select'?sc.markers.flatMap(m=>(m.arrows||[]).map(a=>`<div class="tip-handle" id="tip-${a.id}" data-mid="${m.id}" data-aid="${a.id}" style="left:${a.x*100}%;top:${a.y*100}%;border-color:${arrowCol(m,a)}"></div>`)).join(''):''}
        ${ed.tool==='select'?(sc.braces||[]).flatMap(b=>[
          `<div class="brace-handle" id="bh-top-${b.id}" data-bid="${b.id}" data-bpart="top" style="border-color:${b.color}" title="Extrémité"></div>`,
          `<div class="brace-handle brace-mid" id="bh-mid-${b.id}" data-bid="${b.id}" data-bpart="mid" style="border-color:${b.color}" title="Déplacer"></div>`,
          `<div class="brace-handle" id="bh-bot-${b.id}" data-bid="${b.id}" data-bpart="bot" style="border-color:${b.color}" title="Extrémité"></div>`,
          `<div class="brace-handle brace-tip" id="bh-tip-${b.id}" data-bid="${b.id}" data-bpart="tip" title="Tirer pour faire pivoter l’accolade"></div>`]).join(''):''}
        ${ed.tool==='select'?(sc.shapes||[]).flatMap(sh=>{
          if(sh.type==='line')return[
            `<div class="tip-handle" id="sh-p1-${sh.id}" data-shid="${sh.id}" data-shpart="p1" style="left:${sh.x1*100}%;top:${sh.y1*100}%;border-color:${sh.color};background:rgba(6,16,30,.9)" title="Déplacer point 1"></div>`,
            `<div class="tip-handle" id="sh-p2-${sh.id}" data-shid="${sh.id}" data-shpart="p2" style="left:${sh.x2*100}%;top:${sh.y2*100}%;border-color:${sh.color};background:rgba(6,16,30,.9)" title="Déplacer point 2"></div>`];
          if(sh.type==='circle')return[
            `<div class="tip-handle" id="sh-ctr-${sh.id}" data-shid="${sh.id}" data-shpart="ctr" style="left:${sh.cx*100}%;top:${sh.cy*100}%;border-color:${sh.color};background:rgba(6,16,30,.9)" title="Déplacer centre"></div>`,
            `<div class="tip-handle" id="sh-rad-${sh.id}" data-shid="${sh.id}" data-shpart="rad" style="left:${(sh.cx+sh.rx)*100}%;top:${(sh.cy+sh.ry)*100}%;background:rgba(6,16,30,.9);border-color:var(--success)" title="Redimensionner"></div>`];
          if(sh.type==='cross')return[
            `<div class="tip-handle" id="sh-ctr-${sh.id}" data-shid="${sh.id}" data-shpart="ctr" style="left:${sh.x*100}%;top:${sh.y*100}%;border-color:${sh.color};background:rgba(6,16,30,.9)" title="Déplacer"></div>`];
          return[];
        }).join(''):''}
        ${sc.texts.map(t=>`<div class="text-annotation editable bg-${t.bg||'dark'} ${ed.selectedTextId===t.id?'selected':''}" id="txt-${t.id}" data-tid="${t.id}" style="left:${t.x*100}%;top:${t.y*100}%;color:${t.color};--fs:${t.fontSize}">${esc(t.text)}</div>`).join('')}
      </div>`:`<div class="upload-zone" id="upload-zone"><div class="upload-icon">🖼️</div><h3>Uploader une image</h3><p>Cliquez ou glissez ici</p></div>`}
    </div>

    <div class="editor-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-h">Informations</div>
        <div class="form-group"><label class="label">Titre</label><input class="input" id="inp-title" value="${esc(sc.title||'')}"></div>
        <div class="form-group"><label class="label">Catégorie</label><input class="input" id="inp-cat" value="${esc(sc.category||'')}"></div>
        <div class="form-group"><label class="label">Semestre</label><select class="select" style="width:100%" id="sel-sem">${SEMESTERS.map(s=>`<option value="${s}" ${sc.semester===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="form-group"><label class="label">Fond</label>
          <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
            ${BG_PRESETS.map(c=>`<div class="color-swatch ${sc.bgColor===c?'active':''} ${needsRing(c)||c==='transparent'?'ring':''}" data-bg="${c}" style="background:${c==='transparent'?'linear-gradient(45deg,#999 25%,transparent 25%,transparent 75%,#999 75%),linear-gradient(45deg,#999 25%,transparent 25%,transparent 75%,#999 75%);background-size:8px 8px;background-position:0 0,4px 4px':c}"></div>`).join('')}
            <input type="color" id="bg-custom" style="width:20px;height:20px;border:1px solid var(--border);background:none;cursor:pointer;padding:0;border-radius:50%" value="${sc.bgColor&&sc.bgColor!=='transparent'?sc.bgColor:'#ffffff'}">
          </div>
        </div>
        ${!sc.imageData?`<button class="btn btn-secondary w-full btn-sm" id="btn-upload-img">🖼️ Uploader image</button>`:''}
      </div>

      <div class="sidebar-section" id="sb-list" style="flex:1;overflow-y:auto">

        <!-- MARKERS -->
        <div class="sidebar-h">Marqueurs <span class="count-badge">${sc.markers.length}</span></div>
        ${sc.markers.length===0?`<p class="empty-hint">📍 Cliquez sur l'image pour placer des marqueurs.</p>`:`<div style="display:flex;flex-direction:column;gap:5px">${sc.markers.map(m=>{
          const dn=getDisplayNum(sc.markers,m),sg=sc.markers.filter(x=>x.groupId===m.groupId);
          return`<div class="ml-item ${ed.selectedMarkerId===m.id?'ml-selected':''}" data-id="${m.id}">
            <div class="ml-top">
              <div class="ml-num" style="border-color:${m.color};color:${m.color}">${dn}</div>
              ${sg.length>1?`<span style="font-size:9px;color:var(--accent);background:rgba(0,200,224,.12);padding:1px 4px;border-radius:3px">×${sg.length}</span>`:''}
              <div class="ml-body"><input class="input input-sm" placeholder="Libellé…" value="${esc(m.label||'')}" data-mid="${m.id}" id="lbl-${m.id}"></div>
              <button class="btn btn-xs btn-danger" data-del="${m.id}">✕</button>
            </div>
            <div class="ml-alias-list">${(m.aliases||[]).map((a,ai)=>`<div class="ml-alias-row"><span style="font-size:9px;color:var(--muted);width:46px;flex-shrink:0">alias ${ai+1}</span><input class="input input-sm" style="flex:1" value="${esc(a)}" data-alias-mid="${m.id}" data-alias-idx="${ai}"><button class="btn btn-xs btn-ghost" data-del-alias="${m.id}" data-del-alias-idx="${ai}">✕</button></div>`).join('')}</div>
            ${(m.arrows||[]).length>0?`<div style="margin-top:5px;border-top:1px solid var(--border);padding-top:4px">${(m.arrows||[]).map((a,ai)=>`
              <div style="display:flex;align-items:center;gap:5px;padding:2px 0">
                <div style="width:7px;height:7px;border-radius:50%;background:${arrowCol(m,a)};flex-shrink:0"></div>
                <span style="font-size:9px;color:var(--muted);flex:1">Flèche ${ai+1}${a.color?'':' · couleur du marqueur'}</span>
                <button class="btn btn-xs btn-danger" data-del-arrow="${m.id}" data-del-arrow-aid="${a.id}">✕ Suppr</button>
              </div>
              <div style="display:flex;gap:4px;padding:2px 0 2px 12px;align-items:center">
                <span style="font-size:9px;color:var(--muted);width:30px">Épais.</span>
                <input type="range" min="1" max="10" value="${a.width||2}" data-aw-mid="${m.id}" data-aw-aid="${a.id}" style="flex:1;height:4px;accent-color:var(--accent)">
                <span id="aw-val-${a.id}" style="font-size:9px;color:var(--accent);min-width:20px">${a.width||2}px</span>
              </div>
              <div style="display:flex;gap:4px;padding:2px 0 2px 12px;align-items:center">
                <span style="font-size:9px;color:var(--muted);width:30px">Coul.</span>
                <div class="color-palette" style="flex:1;gap:2px">
                  <div class="color-swatch auto ${!a.color?'active':''}" style="width:14px;height:14px" data-ac-mid="${m.id}" data-ac-aid="${a.id}" data-ac-val="" title="Comme le marqueur"></div>
                  ${ALL_COLORS.map(c=>`<div class="color-swatch ${a.color===c?'active':''} ${needsRing(c)?'ring':''}" style="background:${c};width:14px;height:14px" data-ac-mid="${m.id}" data-ac-aid="${a.id}" data-ac-val="${c}" title="${c}"></div>`).join('')}
                </div>
              </div>
              <div style="display:flex;gap:4px;padding:2px 0 4px 12px;align-items:center;border-bottom:1px solid var(--border)">
                <span style="font-size:9px;color:var(--muted);width:30px">Cont.</span>
                <select class="select" style="flex:1;font-size:10px" data-aw-out-mid="${m.id}" data-aw-out-aid="${a.id}"><option value="">— aucun</option>${['#000000','#ffffff','#ffb340','#ff4d6a','#00e09a'].map(c=>`<option value="${c}" ${a.outline===c?'selected':''}>${c}</option>`).join('')}</select>
              </div>`).join('')}</div>`:''}
            <div class="ml-actions">
              <button class="btn btn-xs btn-secondary" data-add-alias="${m.id}">＋ Alias</button>
              <button class="btn btn-xs" data-add-arrow="${m.id}">🏹 Flèche</button>
              <button class="btn btn-xs" data-add-group="${m.id}">⊕ Même N°</button>
              <select class="select" style="width:auto;padding:1px 4px;font-size:10px" data-col-mid="${m.id}">${PIN_COLORS.map(c=>`<option value="${c}" ${m.color===c?'selected':''}>${c}</option>`).join('')}</select>
            </div>
          </div>`;}).join('')}</div>`}

        <!-- BRACES -->
        ${(sc.braces||[]).length>0?`<div class="sidebar-h" style="margin-top:12px">Accolades <span class="count-badge">${sc.braces.length}</span></div>
        <div style="display:flex;flex-direction:column;gap:5px">${sc.braces.map((b,bi)=>`<div class="ml-item ${ed.selectedBraceId===b.id?'ml-selected':''}" data-bid="${b.id}">
          <div class="ml-top"><span style="font-size:11px;color:${b.color};font-weight:700;flex-shrink:0">⌐${bi+1}</span>
            <div style="flex:1"><input class="input input-sm" placeholder="Libellé…" value="${esc(b.label||'')}" data-blbl="${b.id}"></div>
            <button class="btn btn-xs btn-danger" data-del-brace="${b.id}">✕</button>
          </div>
          <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center">
            <select class="select" style="flex:1;font-size:10px" data-b-dir="${b.id}" title="Sens de la pointe">${[['right','→ Droite'],['left','← Gauche'],['down','↓ Bas'],['up','↑ Haut'],['free','✥ Libre']].map(([k,l])=>`<option value="${k}" ${braceDirOf(b)===k?'selected':''}>${l}</option>`).join('')}</select>
            <button class="btn btn-xs" data-b-flip="${b.id}" title="Inverser le sens">⇄</button>
            <select class="select" style="flex:1;font-size:10px" data-b-col="${b.id}">${BRACE_COLORS.map(c=>`<option value="${c}" ${b.color===c?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div style="display:flex;gap:4px;margin-top:3px;align-items:center">
            <span style="font-size:9px;color:var(--muted);width:32px">Épais.</span>
            <input type="range" min="1" max="8" value="${b.lineWidth||2}" data-b-lw="${b.id}" style="flex:1;height:4px;accent-color:var(--accent)">
            <span id="blw-val-${b.id}" style="font-size:9px;color:var(--accent);min-width:20px">${b.lineWidth||2}px</span>
          </div>
          <div style="display:flex;gap:4px;margin-top:3px;align-items:center">
            <span style="font-size:9px;color:var(--muted);width:32px">Texte</span>
            <input type="range" min="8" max="30" value="${b.fontSize||13}" data-b-fs="${b.id}" style="flex:1;height:4px;accent-color:var(--accent)">
            <span id="bfs-val-${b.id}" style="font-size:9px;color:var(--accent);min-width:22px">${b.fontSize||13}px</span>
          </div>
          <div style="display:flex;gap:4px;margin-top:3px;align-items:center">
            <span style="font-size:9px;color:var(--muted);width:32px">Rotat.</span>
            <input type="range" min="-180" max="180" value="${Math.round(normAng(b.angle||0))}" data-b-angle="${b.id}" style="flex:1;height:4px;accent-color:var(--accent)">
            <span id="bangle-val-${b.id}" style="font-size:9px;color:var(--accent);min-width:28px">${Math.round(normAng(b.angle||0))}°</span>
          </div>
        </div>`).join('')}</div>`:''}

        <!-- SHAPES -->
        ${(sc.shapes||[]).length>0?`<div class="sidebar-h" style="margin-top:12px">Formes <span class="count-badge">${sc.shapes.length}</span>
          <button class="btn btn-xs btn-danger" id="btn-clear-shapes" style="margin-left:auto">🗑️ Tout effacer</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">${(sc.shapes||[]).map((sh,si)=>`<div class="ml-item" data-shid="${sh.id}" style="padding:6px 8px">
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:9px;height:9px;border-radius:${sh.type==='circle'?'50%':'2px'};background:none;border:2px solid ${sh.color};flex-shrink:0"></div>
            <span style="font-size:11px;font-weight:600;flex:1">${{line:'— Ligne',freehand:'✏️ Main libre',circle:'○ Cercle',cross:'✕ Croix'}[sh.type]||sh.type} ${si+1}</span>
            <select class="select" style="width:auto;font-size:10px;padding:1px 4px" data-sh-col="${sh.id}">${ALL_COLORS.map(c=>`<option value="${c}" ${sh.color===c?'selected':''}>${c}</option>`).join('')}</select>
            <select class="select" style="width:auto;font-size:10px;padding:1px 4px" data-sh-dash="${sh.id}"><option value="" ${sh.dash===''?'selected':''}>—</option><option value="dashed" ${sh.dash==='dashed'?'selected':''}>---</option><option value="dotted" ${sh.dash==='dotted'?'selected':''}>..</option></select>
            <button class="btn btn-xs btn-danger" data-del-sh="${sh.id}">✕</button>
          </div>
          <div style="display:flex;gap:4px;margin-top:3px;align-items:center">
            <span style="font-size:9px;color:var(--muted);width:30px">Épais.</span>
            <input type="range" min="1" max="12" value="${sh.lineWidth||2}" data-sh-lw="${sh.id}" style="flex:1;height:4px;accent-color:var(--accent)">
            <span id="sh-lw-val-${sh.id}" style="font-size:9px;color:var(--accent);min-width:20px">${sh.lineWidth||2}px</span>
          </div>
        </div>`).join('')}</div>`:''}

        <!-- TEXTS -->
        ${sc.texts&&sc.texts.length>0?`<div class="sidebar-h" style="margin-top:12px">Textes <span class="count-badge">${sc.texts.length}</span></div>
        <div style="display:flex;flex-direction:column;gap:4px">${sc.texts.map(t=>`<div class="ml-item ${ed.selectedTextId===t.id?'ml-selected':''}" data-tid="${t.id}">
          <div style="display:flex;gap:5px;align-items:center">
            <div style="width:8px;height:8px;border-radius:50%;background:${t.color};flex-shrink:0"></div>
            <input class="input input-sm" style="flex:1" value="${esc(t.text)}" data-tid-inp="${t.id}">
            <input type="number" class="input input-sm" style="width:48px" value="${t.fontSize}" data-tid-size="${t.id}" min="8" max="72">
            <button class="btn btn-xs btn-danger" data-del-tid="${t.id}">✕</button>
          </div>
          <div style="display:flex;gap:5px;align-items:center;margin-top:4px">
            <select class="select" style="flex:1;padding:1px 4px;font-size:10px" data-tid-color="${t.id}">${TEXT_COLORS.map(c=>`<option value="${c}" ${t.color===c?'selected':''}>${c}</option>`).join('')}</select>
            <select class="select" style="flex:1;padding:1px 4px;font-size:10px" data-tid-bg="${t.id}" title="Fond du texte"><option value="dark" ${(t.bg||'dark')==='dark'?'selected':''}>■ fond sombre</option><option value="light" ${t.bg==='light'?'selected':''}>□ fond clair</option><option value="none" ${t.bg==='none'?'selected':''}>∅ contour seul</option></select>
          </div>
        </div>`).join('')}</div>`:''}

      </div>
    </div>
  </div>
</div>`;

  /* ── Basic ── */
  document.getElementById('inp-title').oninput=e=>{sc.title=e.target.value;save();};
  document.getElementById('inp-cat').oninput=e=>{sc.category=e.target.value;save();};
  document.getElementById('sel-sem').onchange=e=>{sc.semester=e.target.value;save();};
  document.getElementById('btn-back').onclick=()=>{undoReset();S.view='home';resetEditor();render();};
  document.getElementById('btn-start-ex').onclick=()=>openExModal(S.editorId);
  document.getElementById('btn-print-menu').onclick=()=>openPrintMenu(S.editorId);
  const up=document.getElementById('btn-upload-img');if(up)up.onclick=()=>document.getElementById('img-upload').click();
  const upN=document.getElementById('tool-upload-new');if(upN)upN.onclick=()=>document.getElementById('img-upload').click();
  document.querySelectorAll('[data-bg]').forEach(sw=>sw.onclick=()=>{sc.bgColor=sw.dataset.bg;save();rerender();});
  const bgc=document.getElementById('bg-custom');if(bgc)bgc.oninput=e=>{sc.bgColor=e.target.value;save();rerender();};
  const uz=document.getElementById('upload-zone');if(uz){uz.onclick=()=>document.getElementById('img-upload').click();uz.ondragover=e=>{e.preventDefault();uz.style.borderColor='var(--accent)';};uz.ondragleave=()=>{uz.style.borderColor='';};uz.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadImage(f);};}

  /* ── Tools / undo / zoom ── */
  ['select','pin','arrow','brace','text','line','freehand','circle','cross'].forEach(t=>{const el=document.getElementById('tool-'+t);if(el)el.onclick=()=>{ed.tool=t;if(t!=='arrow')ed.arrowFrom=null;ed.drawDraft=null;ed.drawPoints=[];ed.drawStart=null;rerender();};});
  const bu=document.getElementById('btn-undo');if(bu)bu.onclick=undoAction;
  const br_=document.getElementById('btn-redo');if(br_)br_.onclick=redoAction;
  const setZoom=z=>{
    ed.zoom=Math.max(.5,Math.min(4,Math.round(z*100)/100));
    const wr=document.getElementById('img-wrapper');if(wr)wr.style.setProperty('--zoom',ed.zoom);
    const lb=document.getElementById('zoom-reset');if(lb)lb.textContent=Math.round(ed.zoom*100)+'%';
  };
  const zi=document.getElementById('zoom-in');if(zi)zi.onclick=()=>setZoom((ed.zoom||1)+.25);
  const zo=document.getElementById('zoom-out');if(zo)zo.onclick=()=>setZoom((ed.zoom||1)-.25);
  const zr=document.getElementById('zoom-reset');if(zr)zr.onclick=()=>setZoom(1);
  document.querySelectorAll('[data-pin-color]').forEach(sw=>sw.onclick=()=>{ed.activeColor=sw.dataset.pinColor;rerender();});
  document.querySelectorAll('[data-text-color]').forEach(sw=>sw.onclick=()=>{ed.activeTextColor=sw.dataset.textColor;rerender();});
  document.querySelectorAll('[data-brace-color]').forEach(sw=>sw.onclick=()=>{ed.activeBraceColor=sw.dataset.braceColor;rerender();});

  /* ── Draw opts ── */
  document.querySelectorAll('[data-draw-color]').forEach(sw=>sw.onclick=()=>{ed.drawColor=sw.dataset.drawColor;rerender();});
  const dw=document.getElementById('draw-width');if(dw){dw.oninput=e=>{ed.drawWidth=parseInt(e.target.value);const sp=document.getElementById('draw-width-val');if(sp)sp.textContent=e.target.value+'px';};}
  const dd=document.getElementById('draw-dash');if(dd){dd.onchange=e=>{ed.drawDash=e.target.value;};}

  /* ── Réglages par défaut (flèches / accolades / textes) ── */
  const D=S.defaults;
  document.querySelectorAll('[data-def-acol]').forEach(sw=>sw.onclick=()=>{D.arrowColor=sw.dataset.defAcol;saveDefaults();rerender();});
  const daw=document.getElementById('def-aw');if(daw)daw.oninput=e=>{D.arrowWidth=parseInt(e.target.value);saveDefaults();const sp=document.getElementById('def-aw-val');if(sp)sp.textContent=e.target.value+'px';};
  const dao=document.getElementById('def-aout');if(dao)dao.onchange=e=>{D.arrowOutline=e.target.value;saveDefaults();};
  const dap=document.getElementById('def-apply-all');
  if(dap)dap.onclick=()=>{let n=0;sc.markers.forEach(m=>(m.arrows||[]).forEach(a=>{a.color=D.arrowColor;a.width=D.arrowWidth;a.outline=D.arrowOutline;n++;}));save();rerender();showToast('✅ '+n+' flèche(s) mise(s) à jour','success');};
  document.querySelectorAll('[data-def-bdir]').forEach(b=>b.onclick=()=>{D.braceDir=b.dataset.defBdir;saveDefaults();rerender();});
  const dbw=document.getElementById('def-bw');if(dbw)dbw.oninput=e=>{D.braceWidth=parseInt(e.target.value);saveDefaults();const sp=document.getElementById('def-bw-val');if(sp)sp.textContent=e.target.value+'px';};
  const dbf=document.getElementById('def-bf');if(dbf)dbf.oninput=e=>{D.braceFont=parseInt(e.target.value);saveDefaults();const sp=document.getElementById('def-bf-val');if(sp)sp.textContent=e.target.value+'px';};
  const dts=document.getElementById('def-ts');if(dts)dts.oninput=e=>{D.textSize=parseInt(e.target.value);saveDefaults();const sp=document.getElementById('def-ts-val');if(sp)sp.textContent=e.target.value+'px';};
  const dtb=document.getElementById('def-tbg');if(dtb)dtb.onchange=e=>{D.textBg=e.target.value;saveDefaults();};

  /* ── Marker label ── */
  document.querySelectorAll('input[data-mid]').forEach(inp=>{
    inp.oninput=e=>{const mid=e.target.dataset.mid,val=e.target.value;updateMarker(S.editorId,mid,{label:val});const m=sc.markers.find(m=>m.id===mid);if(m)sc.markers.filter(x=>x.groupId===m.groupId&&x.id!==mid).forEach(x=>{x.label=val;});save();};
    inp.onfocus=e=>{ed.selectedMarkerId=e.target.dataset.mid;ed.selectedTextId=null;ed.selectedBraceId=null;document.querySelectorAll('.marker-pin[data-id]').forEach(p=>p.classList.toggle('selected',p.dataset.id===ed.selectedMarkerId));};
    inp.onclick=e=>e.stopPropagation();
  });
  document.querySelectorAll('[data-alias-mid]').forEach(inp=>{inp.oninput=e=>{const m=sc.markers.find(m=>m.id===e.target.dataset.aliasMid);if(!m)return;if(!m.aliases)m.aliases=[];m.aliases[parseInt(e.target.dataset.aliasIdx)]=e.target.value;save();};inp.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-add-alias]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const m=sc.markers.find(m=>m.id===btn.dataset.addAlias);if(!m)return;if(!m.aliases)m.aliases=[];m.aliases.push('');save();ed.selectedMarkerId=m.id;rerender();setTimeout(()=>{const els=document.querySelectorAll(`[data-alias-mid="${m.id}"]`);if(els.length)els[els.length-1].focus();},60);};});
  document.querySelectorAll('[data-del-alias]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const m=sc.markers.find(m=>m.id===btn.dataset.delAlias);if(!m)return;m.aliases.splice(parseInt(btn.dataset.delAliasIdx),1);save();rerender();};});
  document.querySelectorAll('[data-add-arrow]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();addArrow(S.editorId,btn.dataset.addArrow);ed.selectedMarkerId=btn.dataset.addArrow;showToast('Flèche ajoutée — glissez la poignée (mode Sélection) ou utilisez l’outil 🏹','warn');rerender();};});
  document.querySelectorAll('[data-del-arrow]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();deleteArrow(S.editorId,btn.dataset.delArrow,btn.dataset.delArrowAid);rerender();};});
  document.querySelectorAll('[data-aw-mid]').forEach(rng=>{rng.oninput=e=>{updateArrow(S.editorId,rng.dataset.awMid,rng.dataset.awAid,{width:parseInt(e.target.value)});const sp=document.getElementById('aw-val-'+rng.dataset.awAid);if(sp)sp.textContent=e.target.value+'px';redrawCanvas();};rng.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-ac-mid]').forEach(sw=>{sw.onclick=e=>{e.stopPropagation();updateArrow(S.editorId,sw.dataset.acMid,sw.dataset.acAid,{color:sw.dataset.acVal});rerender();};});
  document.querySelectorAll('[data-aw-out-mid]').forEach(sel=>{sel.onchange=e=>{e.stopPropagation();updateArrow(S.editorId,sel.dataset.awOutMid,sel.dataset.awOutAid,{outline:e.target.value});rerender();};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-col-mid]').forEach(sel=>{sel.onchange=e=>{e.stopPropagation();updateMarker(S.editorId,sel.dataset.colMid,{color:e.target.value});rerender();};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-add-group]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const m=addGroupMarker(S.editorId,btn.dataset.addGroup);if(m){ed.selectedMarkerId=m.id;rerender();showToast('Marqueur ajouté (même N°) — glissez-le','warn');}};});
  document.querySelectorAll('[data-del]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();if(ed.selectedMarkerId===btn.dataset.del)ed.selectedMarkerId=null;deleteMarker(S.editorId,btn.dataset.del);rerender();};});
  document.querySelectorAll('.ml-item[data-id]').forEach(el=>{el.onclick=e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;ed.selectedMarkerId=el.dataset.id;ed.selectedBraceId=null;ed.selectedTextId=null;if(ed.tool==='arrow')ed.arrowFrom=el.dataset.id;rerender();};});
  /* Brace */
  document.querySelectorAll('[data-blbl]').forEach(inp=>{inp.oninput=e=>{updateBrace(S.editorId,e.target.dataset.blbl,{label:e.target.value});redrawCanvas();};inp.onclick=e=>e.stopPropagation();});
  const braceChanged=b=>{save();redrawCanvas();layoutBraceHandles();syncBraceSidebar(b);};
  document.querySelectorAll('[data-b-dir]').forEach(sel=>{sel.onchange=e=>{e.stopPropagation();const b=sc.braces.find(x=>x.id===sel.dataset.bDir);if(!b)return;const v=e.target.value;if(v==='free'){syncBraceSidebar(b);return;}b.angle=BRACE_ANGLES[v];braceChanged(b);};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-b-flip]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const b=sc.braces.find(x=>x.id===btn.dataset.bFlip);if(!b)return;b.angle=normAng((b.angle||0)+180);braceChanged(b);};});
  document.querySelectorAll('[data-b-col]').forEach(sel=>{sel.onchange=e=>{e.stopPropagation();updateBrace(S.editorId,sel.dataset.bCol,{color:e.target.value});rerender();};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-b-lw]').forEach(rng=>{rng.oninput=e=>{updateBrace(S.editorId,rng.dataset.bLw,{lineWidth:parseInt(e.target.value)});const sp=document.getElementById('blw-val-'+rng.dataset.bLw);if(sp)sp.textContent=e.target.value+'px';redrawCanvas();};rng.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-b-fs]').forEach(rng=>{rng.oninput=e=>{updateBrace(S.editorId,rng.dataset.bFs,{fontSize:parseInt(e.target.value)});const sp=document.getElementById('bfs-val-'+rng.dataset.bFs);if(sp)sp.textContent=e.target.value+'px';redrawCanvas();};rng.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-b-angle]').forEach(rng=>{rng.oninput=e=>{const b=sc.braces.find(x=>x.id===rng.dataset.bAngle);if(!b)return;b.angle=parseInt(e.target.value);braceChanged(b);};rng.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-del-brace]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();if(ed.selectedBraceId===btn.dataset.delBrace)ed.selectedBraceId=null;deleteBrace(S.editorId,btn.dataset.delBrace);rerender();};});
  document.querySelectorAll('.ml-item[data-bid]').forEach(el=>{el.onclick=e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;ed.selectedBraceId=el.dataset.bid;ed.selectedMarkerId=null;ed.selectedTextId=null;rerender();};});
  /* Shapes */
  const clearShapes=document.getElementById('btn-clear-shapes');if(clearShapes)clearShapes.onclick=()=>{if(confirm('Effacer toutes les formes ?')){sc.shapes=[];save();rerender();}};
  document.querySelectorAll('[data-sh-col]').forEach(sel=>{sel.onchange=e=>{e.stopPropagation();updateShape(S.editorId,sel.dataset.shCol,{color:e.target.value});redrawCanvas();};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-sh-dash]').forEach(sel=>{sel.onchange=e=>{e.stopPropagation();updateShape(S.editorId,sel.dataset.shDash,{dash:e.target.value});redrawCanvas();};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-sh-lw]').forEach(rng=>{rng.oninput=e=>{updateShape(S.editorId,rng.dataset.shLw,{lineWidth:parseInt(e.target.value)});const sp=document.getElementById('sh-lw-val-'+rng.dataset.shLw);if(sp)sp.textContent=e.target.value+'px';redrawCanvas();};rng.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-del-sh]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();deleteShape(S.editorId,btn.dataset.delSh);rerender();};});
  /* Text */
  document.querySelectorAll('[data-tid-inp]').forEach(inp=>{inp.oninput=e=>{updateText(S.editorId,e.target.dataset.tidInp,{text:e.target.value});refreshTxt(e.target.dataset.tidInp);};inp.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-tid-size]').forEach(inp=>{inp.oninput=e=>{updateText(S.editorId,e.target.dataset.tidSize,{fontSize:parseInt(e.target.value)||14});refreshTxt(e.target.dataset.tidSize);};inp.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-tid-color]').forEach(sel=>{sel.onchange=e=>{updateText(S.editorId,sel.dataset.tidColor,{color:e.target.value});refreshTxt(sel.dataset.tidColor);};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-tid-bg]').forEach(sel=>{sel.onchange=e=>{updateText(S.editorId,sel.dataset.tidBg,{bg:e.target.value});refreshTxt(sel.dataset.tidBg);};sel.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('[data-del-tid]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();if(ed.selectedTextId===btn.dataset.delTid)ed.selectedTextId=null;deleteText(S.editorId,btn.dataset.delTid);rerender();};});
  document.querySelectorAll('.ml-item[data-tid]').forEach(el=>{el.onclick=e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;ed.selectedTextId=el.dataset.tid;ed.selectedMarkerId=null;ed.selectedBraceId=null;rerender();};});

  /* Restaurer les défilements (liste des marqueurs, panneau, image) — c'était la cause du « retour au marqueur 1 » */
  Object.keys(_scr).forEach(q=>{const el=document.querySelector(q);if(el){el.scrollTop=_scr[q][0];el.scrollLeft=_scr[q][1];}});

  /* ── Image interactions ── */
  const wrapper=document.getElementById('img-wrapper');
  if(wrapper){
    watchImage(); // taille de l'image → échelle des annotations, canvas, poignées d'accolades

    /* Non-draw click */
    wrapper.onclick=e=>{
      if(performance.now()<(ed._noClickUntil||0))return;
      if(e.target.closest('.marker-pin')||e.target.closest('.text-annotation')||e.target.closest('.tip-handle')||e.target.closest('.brace-handle')||e.target.dataset.shid)return;
      const pos=getImgPos(e);if(!pos)return;
      if(ed.tool==='pin'){const m=addMarker(S.editorId,pos.x,pos.y,ed.activeColor);ed.selectedMarkerId=m.id;ed.selectedBraceId=null;ed.selectedTextId=null;rerender();setTimeout(()=>{const el=document.getElementById('lbl-'+m.id);if(el)el.focus();},60);}
      else if(ed.tool==='text'){const t=addText(S.editorId,pos.x,pos.y,ed.activeTextColor);ed.selectedTextId=t.id;ed.selectedMarkerId=null;ed.selectedBraceId=null;rerender();setTimeout(()=>{const el=document.querySelector('[data-tid-inp="'+t.id+'"]');if(el)el.focus();},60);}
      else if(ed.tool==='arrow'){
        const mid=ed.arrowFrom||ed.selectedMarkerId;
        if(!mid||!sc.markers.some(m=>m.id===mid)){showToast('Cliquez d’abord sur le marqueur d’origine','warn');return;}
        addArrow(S.editorId,mid,pos.x,pos.y);ed.arrowFrom=mid;ed.selectedMarkerId=mid;rerender();
      }
      else if(ed.tool==='cross'){
        addShape(S.editorId,{type:'cross',x:pos.x,y:pos.y,color:ed.drawColor,lineWidth:ed.drawWidth,dash:ed.drawDash,size:0.03});
        rerender();
      }
      else if(ed.tool==='select'){ed.selectedMarkerId=null;ed.selectedBraceId=null;ed.selectedTextId=null;rerender();}
    };

    /* Draw tool drag */
    let drawDragging=false;
    wrapper.onmousedown=e=>{
      if(e.button!==0)return;
      if(e.target.closest('.marker-pin')||e.target.closest('.tip-handle')||e.target.closest('.brace-handle')||e.target.closest('.text-annotation'))return;
      const pos=getImgPos(e);if(!pos)return;
      if(isDrawTool(ed.tool)&&ed.tool!=='cross'){
        e.preventDefault();
        drawDragging=true;
        ed.drawStart={x:pos.x,y:pos.y};
        if(ed.tool==='freehand'){ed.drawPoints=[{x:pos.x,y:pos.y}];}
      }
      if(ed.tool==='brace'){
        e.preventDefault();drawDragging=true;
        ed.drawStart={x:pos.x,y:pos.y};
      }
    };

    const onMouseMove=e=>{
      if(!drawDragging||!ed.drawStart)return;
      const pos=getImgPos(e);if(!pos)return;
      const r=pos.r;
      redrawCanvas();
      const canvas=document.getElementById('arrow-canvas');if(!canvas)return;
      const ctx=canvas.getContext('2d');

      if(ed.tool==='freehand'){
        const last=ed.drawPoints[ed.drawPoints.length-1];
        const dx=(pos.x-last.x)*r.width,dy=(pos.y-last.y)*r.height;
        if(Math.sqrt(dx*dx+dy*dy)>3)ed.drawPoints.push({x:pos.x,y:pos.y});
        drawShape(ctx,r,{type:'freehand',pts:ed.drawPoints,color:ed.drawColor,lineWidth:ed.drawWidth,dash:ed.drawDash});
      } else if(ed.tool==='line'){
        drawShape(ctx,r,{type:'line',x1:ed.drawStart.x,y1:ed.drawStart.y,x2:pos.x,y2:pos.y,color:ed.drawColor,lineWidth:ed.drawWidth,dash:ed.drawDash});
      } else if(ed.tool==='circle'){
        const cx=(ed.drawStart.x+pos.x)/2,cy=(ed.drawStart.y+pos.y)/2;
        const rx=Math.abs(pos.x-ed.drawStart.x)/2,ry=Math.abs(pos.y-ed.drawStart.y)/2;
        drawShape(ctx,r,{type:'circle',cx,cy,rx,ry,color:ed.drawColor,lineWidth:ed.drawWidth,dash:ed.drawDash});
      } else if(ed.tool==='brace'){
        const g=makeBraceFromDrag(ed.drawStart,pos,S.defaults.braceDir,r);
        drawCurlyBrace(ctx,r,{x:g.x,y1:g.y1,y2:g.y2,angle:g.angle,label:'',color:ed.activeBraceColor,lineWidth:S.defaults.braceWidth,fontSize:S.defaults.braceFont});
      }
    };
    const onMouseUp=e=>{
      if(!drawDragging){return;}
      drawDragging=false;
      const pos=getImgPos(e);if(!pos){ed.drawStart=null;ed.drawDraft=null;return;}

      if(ed.tool==='freehand'&&ed.drawPoints.length>1){
        addShape(S.editorId,{type:'freehand',pts:[...ed.drawPoints],color:ed.drawColor,lineWidth:ed.drawWidth,dash:ed.drawDash});
        ed.drawPoints=[];rerender();
      } else if(ed.tool==='line'){
        const dx=Math.abs(pos.x-ed.drawStart.x),dy=Math.abs(pos.y-ed.drawStart.y);
        if(dx>0.005||dy>0.005){addShape(S.editorId,{type:'line',x1:ed.drawStart.x,y1:ed.drawStart.y,x2:pos.x,y2:pos.y,color:ed.drawColor,lineWidth:ed.drawWidth,dash:ed.drawDash});rerender();}
      } else if(ed.tool==='circle'){
        const rx=Math.abs(pos.x-ed.drawStart.x)/2,ry=Math.abs(pos.y-ed.drawStart.y)/2;
        if(rx>0.005||ry>0.005){addShape(S.editorId,{type:'circle',cx:(ed.drawStart.x+pos.x)/2,cy:(ed.drawStart.y+pos.y)/2,rx,ry,color:ed.drawColor,lineWidth:ed.drawWidth,dash:ed.drawDash});rerender();}
      } else if(ed.tool==='brace'){
        const g=makeBraceFromDrag(ed.drawStart,pos,S.defaults.braceDir,pos.r);
        if(g.len>10){
          const b=addBrace(S.editorId,g.x,g.y1,g.y2,ed.activeBraceColor,g.angle);
          ed.selectedBraceId=b.id;ed.selectedMarkerId=null;ed.selectedTextId=null;rerender();
          setTimeout(()=>{const el=document.querySelector('[data-blbl="'+b.id+'"]');if(el)el.focus();},60);
        } else rerender();
      }
      ed.drawStart=null;ed.drawDraft=null;
    };
    document.addEventListener('mousemove',onMouseMove);
    document.addEventListener('mouseup',onMouseUp);
    wrapper._cleanupDraw=()=>{document.removeEventListener('mousemove',onMouseMove);document.removeEventListener('mouseup',onMouseUp);};

    /* Marker drag + outil flèche */
    sc.markers.forEach(m=>{
      const pin=document.getElementById('pin-'+m.id);if(!pin)return;
      pin.onclick=e=>{e.stopPropagation();ed.selectedMarkerId=m.id;ed.selectedBraceId=null;ed.selectedTextId=null;if(ed.tool==='arrow')ed.arrowFrom=m.id;selectPinUI(m.id);};
      makeDraggable(pin,(nx,ny)=>{m.x=nx;m.y=ny;save();redrawCanvas();},()=>{ed.selectedMarkerId=m.id;ed.selectedBraceId=null;ed.selectedTextId=null;});
      const drag=pin.onmousedown;
      pin.onmousedown=e=>{
        if(ed.tool==='arrow'){e.preventDefault();e.stopPropagation();ed.arrowFrom=m.id;ed.selectedMarkerId=m.id;selectPinUI(m.id);startArrowDrag(m,e);return;}
        if(drag)drag.call(pin,e);
      };
    });
    /* Arrow tip drag */
    sc.markers.forEach(m=>(m.arrows||[]).forEach(a=>{const h=document.getElementById('tip-'+a.id);if(!h)return;makeDraggable(h,(nx,ny)=>{a.x=nx;a.y=ny;save();redrawCanvas();},null);}));
    /* Brace drag : extrémités (rotation + longueur), centre (déplacement), pointe verte (rotation pure) */
    (sc.braces||[]).forEach(b=>{
      ['top','mid','bot','tip'].forEach(part=>{
        const h=document.getElementById('bh-'+part+'-'+b.id);if(!h)return;
        h.onclick=e=>{e.stopPropagation();ed.selectedBraceId=b.id;ed.selectedMarkerId=null;ed.selectedTextId=null;selectBraceUI(b.id);};
        makeDraggable(h,(nx,ny)=>{
          const img=document.getElementById('main-img');if(!img)return;
          const r=img.getBoundingClientRect(),px=nx*r.width,py=ny*r.height,g=braceGeom(b,r);
          if(part==='top')braceFromEnds(b,px,py,g.bx,g.by,r);
          else if(part==='bot')braceFromEnds(b,g.ax,g.ay,px,py,r);
          else if(part==='mid'){const half=(b.y2-b.y1)/2;b.x=nx;b.y1=ny-half;b.y2=ny+half;}
          else{b.angle=snapAng(Math.atan2(py-g.cy,px-g.cx)*180/Math.PI);}
          save();redrawCanvas();layoutBraceHandles();syncBraceSidebar(b);
        },()=>{ed.selectedBraceId=b.id;ed.selectedMarkerId=null;ed.selectedTextId=null;selectBraceUI(b.id);});
      });
    });
    /* Text drag */
    sc.texts.forEach(t=>{const el=document.getElementById('txt-'+t.id);if(!el)return;el.onclick=e=>{e.stopPropagation();ed.selectedTextId=t.id;ed.selectedMarkerId=null;ed.selectedBraceId=null;rerender();};makeDraggable(el,(nx,ny)=>{t.x=nx;t.y=ny;save();},()=>{ed.selectedTextId=t.id;ed.selectedMarkerId=null;ed.selectedBraceId=null;});});
    /* Shape handles drag */
    (sc.shapes||[]).forEach(sh=>{
      function shHandle(elId,onDrag){
        const h=document.getElementById(elId);if(!h)return;
        makeDraggable(h,(nx,ny)=>{onDrag(nx,ny);save();redrawCanvas();
          if(sh.type==='circle'){
            const ctr=document.getElementById('sh-ctr-'+sh.id);if(ctr){ctr.style.left=(sh.cx*100)+'%';ctr.style.top=(sh.cy*100)+'%';}
            const rad=document.getElementById('sh-rad-'+sh.id);if(rad){rad.style.left=((sh.cx+sh.rx)*100)+'%';rad.style.top=((sh.cy+sh.ry)*100)+'%';}
          }
        },null);
      }
      if(sh.type==='line'){
        shHandle('sh-p1-'+sh.id,(nx,ny)=>{sh.x1=nx;sh.y1=ny;});
        shHandle('sh-p2-'+sh.id,(nx,ny)=>{sh.x2=nx;sh.y2=ny;});
      } else if(sh.type==='circle'){
        shHandle('sh-ctr-'+sh.id,(nx,ny)=>{sh.cx=nx;sh.cy=ny;});
        shHandle('sh-rad-'+sh.id,(nx,ny)=>{sh.rx=Math.max(0.005,Math.abs(nx-sh.cx));sh.ry=Math.max(0.005,Math.abs(ny-sh.cy));});
      } else if(sh.type==='cross'){
        shHandle('sh-ctr-'+sh.id,(nx,ny)=>{sh.x=nx;sh.y=ny;});
      }
    });
  }
}

function makeDraggable(el,onMove,onStart){
  let drag=false,sx,sy,smx,smy;
  el.onmousedown=e=>{
    if(S.editor.tool!=='select')return;
    e.preventDefault();e.stopPropagation();drag=true;sx=e.clientX;sy=e.clientY;
    smx=parseFloat(el.style.left)/100;smy=parseFloat(el.style.top)/100;
    if(onStart)onStart();
    const img=document.getElementById('main-img');
    const mv=ev=>{if(!drag||!img)return;const r=img.getBoundingClientRect();const nx=Math.max(0,Math.min(1,smx+(ev.clientX-sx)/r.width));const ny=Math.max(0,Math.min(1,smy+(ev.clientY-sy)/r.height));el.style.left=(nx*100)+'%';el.style.top=(ny*100)+'%';onMove(nx,ny);};
    const up=()=>{drag=false;document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  };
}
function refreshTxt(tid){const sc=getSchema(S.editorId);if(!sc)return;const t=(sc.texts||[]).find(t=>t.id===tid);if(!t)return;const el=document.getElementById('txt-'+tid);if(!el)return;el.textContent=t.text;el.style.color=t.color;el.style.setProperty('--fs',t.fontSize);el.classList.remove('bg-dark','bg-light','bg-none');el.classList.add('bg-'+(t.bg||'dark'));}
function loadImage(file){compressImage(file).then(data=>{const sc=getSchema(S.editorId);if(!sc)return;sc.imageData=data;sc.ar=null;save();const si=storageInfo();if(si.pct>75)showToast('⚠️ Stockage à '+si.pct+'%','warn');else showToast('✅ Image chargée','success');render();});}

/* ══ EXERCISES ══ */
function exPins(sc,ex){return sc.markers.map(m=>{const g=ex.groups.find(gr=>gr.groupId===m.groupId);if(!g)return'';let bc=m.color;if(ex.submitted){const ok=isCorrect(ex.answers[g.groupId]||'',g)||(ex.manualCorrect&&ex.manualCorrect[g.groupId]);bc=ok?'var(--success)':'var(--error)';}return`<div class="marker-pin fill-pin" data-gid="${g.groupId}" style="left:${m.x*100}%;top:${m.y*100}%;border-color:${bc};color:${pinText(m.color)};background:rgba(6,16,30,.9);box-shadow:0 0 8px ${bc}99">${g.displayNum}</div>`;}).join('');}
function setupExCanvas(){watchImage();}

function renderExFill(app){
  const ex=S.ex;const sc=getSchema(ex.schemaId);if(!sc){S.view='home';render();return;}
  app.innerHTML=`<div class="exercise-view">
  <div class="app-header"><button class="btn btn-ghost btn-sm" id="btn-back">← Quitter</button><div class="ex-title">✍️ <strong>${sc.title}</strong></div><div class="header-actions"><span class="sem-badge" style="background:${getSemColor(sc.semester)};color:#000">${sc.semester}</span></div></div>
  <div class="exercise-layout">
    <div class="exercise-img-area"><div class="img-wrapper" id="img-wrapper" style="${wrapStyle(sc)}">
      <img class="main-img-ex" id="main-img" src="${sc.imageData||''}" draggable="false">
      <canvas class="arrow-canvas" id="arrow-canvas"></canvas>${exPins(sc,ex)}</div></div>
    <div class="exercise-panel">
      <div class="panel-title">Identifiez les zones</div>
      <div class="tolerance-info">✅ <strong>Tolérance</strong> : casse, accents, tirets ignorés · Alias acceptés</div>
      <div class="fill-list">${ex.groups.map(g=>{
        const ans=ex.answers[g.groupId]||'';
        const autoOk=ex.submitted?isCorrect(ans,g):null;
        const manOk=ex.submitted&&ex.manualCorrect&&ex.manualCorrect[g.groupId];

    el.addEventListener('focus',e=>highlightPin(el.dataset.gid));

  });

      e.stopPropagation();
      const inp=document.querySelector('[data-gid="'+pin.dataset.gid+'"]');
      if(inp&&!ex.submitted){inp.focus();inp.scrollIntoView({block:'nearest'});}
      else highlightPin(pin.dataset.gid);

function submitFill(){
  const ex=S.ex;if(!ex||ex.submitted)return;
  let ok=0;
  ex.groups.forEach(g=>{if(isCorrect(ex.answers[g.groupId]||'',g)||(ex.manualCorrect&&ex.manualCorrect[g.groupId]))ok++;});
  ex.submitted=true;ex.score=Math.round(ok/ex.groups.length*100);render();
  // Validation mode: hook after render so score buttons show, then auto-advance via "Continuer"
}
function highlightPin(groupId){
  // Remove previous highlight
  document.querySelectorAll('.marker-pin.highlight').forEach(p=>p.classList.remove('highlight'));
  if(!groupId)return;
  // Find all pins belonging to this group
  const ex=S.ex;const sc=getSchema(ex&&ex.schemaId);if(!sc)return;
  const group=ex.groups.find(g=>g.groupId===groupId);if(!group)return;
  group.markers.forEach(m=>{
    // Find the pin element — iterate over .marker-pin elements
    document.querySelectorAll('.fill-pin[data-gid="'+groupId+'"]').forEach(pin=>{
      pin.classList.add('highlight');
    });
  });
}
function markManualCorrect(groupId){
  const ex=S.ex;if(!ex)return;
  if(!ex.manualCorrect)ex.manualCorrect={};
  ex.manualCorrect[groupId]=true;
  // Recalculate score
  if(ex.submitted){
    let ok=0;
    ex.groups.forEach(g=>{if(isCorrect(ex.answers[g.groupId]||'',g)||ex.manualCorrect[g.groupId])ok++;});
    ex.score=Math.round(ok/ex.groups.length*100);
  }
  render();
}

function locateAnswer(clickedGroupId,skip){
  const ex=S.ex;const sc=getSchema(ex.schemaId);if(!sc)return;
  const label=ex.locateQueue[ex.locateIdx];if(!label){ex.locateDone=true;render();return;}
  // candidates = all groups whose label or aliases include this label
  const correctGroups=ex.groups.filter(g=>[g.label,...(g.aliases||[])].map(l=>l.trim()).includes(label));
  const correctGids=new Set(correctGroups.map(g=>g.groupId));
  const correct=!skip&&clickedGroupId!=null&&correctGids.has(clickedGroupId);
  const correctNums=correctGroups.map(g=>g.displayNum);
  ex.locateResults.push({label,correct,skipped:skip});
  if(!skip)ex.feedback={clickedGroupId,correct,correctNums};
  else ex.feedback=null;
  if(ex.feedbackTimeout)clearTimeout(ex.feedbackTimeout);
  ex.feedbackTimeout=setTimeout(()=>{
    ex.feedback=null;ex.locateIdx++;
    if(ex.locateIdx>=ex.locateQueue.length){ex.locateDone=true;}
    render();
    if(ex.locateDone&&S.val.active){
      const pct=Math.round(ex.locateResults.filter(r=>r.correct).length/ex.locateResults.length*100);
      setTimeout(()=>valRecordAndContinue(pct),800);
    }
  },skip?0:1000);
  render();
}

      <button class="btn btn-secondary" id="btn-home">← Bibliothèque</button>
    </div>
  </div></div>
</div>`;
  document.getElementById('btn-back').onclick=document.getElementById('btn-home').onclick=()=>{S.view='home';render();};
  document.getElementById('btn-retry').onclick=()=>startClickPin(ex.schemaId);
}

/* ══ FILE INPUTS ══ */
document.getElementById('img-upload').onchange=e=>{const f=e.target.files[0];if(f)loadImage(f);e.target.value='';};
document.getElementById('json-import').onchange=e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value='';};
document.getElementById('scores-import').onchange=e=>{const f=e.target.files[0];if(f)importScoresFile(f);e.target.value='';};
window.addEventListener('resize',()=>syncScale());

load();

render();
