<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnatomyLab – Révision Anatomie</title>
<style>
:root{--bg:#06101e;--bg2:#0d1928;--bg3:#132135;--border:#1e3554;--accent:#00c8e0;--accent2:#0097aa;--text:#d4e8f4;--muted:#5a7fa0;--success:#00e09a;--error:#ff4d6a;--warn:#ffb340;--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;}
#app{height:100vh;overflow:hidden;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 13px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;}
.btn:hover{background:rgba(255,255,255,.07);}.btn:active{transform:scale(.97);}.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;}.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:rgba(0,200,224,.12);border-color:rgba(0,200,224,.3);color:var(--accent);}.btn-secondary:hover{background:rgba(0,200,224,.2);}
.btn-danger{border-color:var(--error);color:var(--error);}.btn-danger:hover{background:rgba(255,77,106,.12);}
.btn-ghost{border-color:transparent;color:var(--muted);}.btn-ghost:hover{color:var(--text);border-color:var(--border);}
.btn-sm{padding:4px 10px;font-size:12px;}.btn-xs{padding:2px 7px;font-size:11px;border-radius:5px;}.w-full{width:100%;justify-content:center;}
.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 10px;font-size:13px;outline:none;transition:border-color .15s;font-family:inherit;}
.input:focus{border-color:var(--accent);}.input::placeholder{color:var(--muted);}
.input-sm{padding:3px 7px;font-size:12px;}
.select{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:4px 7px;font-size:12px;outline:none;cursor:pointer;font-family:inherit;}
.select:focus{border-color:var(--accent);}.select option{background:var(--bg2);}
.form-group{margin-bottom:9px;}.label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.sem-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.app-header{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);min-height:50px;flex-shrink:0;flex-wrap:wrap;}
.header-brand{font-size:17px;font-weight:800;color:var(--accent);white-space:nowrap;line-height:1.3;}
.header-brand em{font-style:normal;font-size:11px;font-weight:500;color:var(--muted);margin-left:4px;}
.header-spacer{flex:1;min-width:6px;}
.header-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.ex-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);}
.ex-title strong{color:var(--text);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.toast-success{border-color:var(--success);color:var(--success);}#toast.toast-error{border-color:var(--error);color:var(--error);}#toast.toast-warn{border-color:var(--warn);color:var(--warn);}
.home-view{display:flex;flex-direction:column;height:100vh;}
.home-content{flex:1;overflow-y:auto;padding:18px;}
.filter-bar{display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.sem-filters{display:flex;gap:4px;flex-wrap:wrap;}
.filter-btn{padding:3px 11px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.filter-btn:hover{color:var(--text);}.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#000;}
.search-input{background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--text);padding:4px 13px;font-size:13px;outline:none;width:180px;margin-left:auto;font-family:inherit;}
.search-input:focus{border-color:var(--accent);}
.schema-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.schema-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .2s;}
.schema-card:hover{border-color:var(--accent);box-shadow:0 4px 22px rgba(0,200,224,.14);transform:translateY(-2px);}
.card-img-area{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg);}
.card-img{width:100%;height:100%;object-fit:cover;display:block;}
.card-no-img{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:32px;color:var(--border);}
.card-no-img span{font-size:11px;color:var(--muted);}
.card-overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;opacity:0;transition:opacity .2s;}
.schema-card:hover .card-overlay{opacity:1;}
.overlay-btn{min-width:120px;}
.card-body{padding:10px;}
.card-title{font-weight:600;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.card-cat{font-size:11px;color:var(--muted);}
.card-markers{font-size:11px;color:var(--muted);margin-left:auto;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-state h3{font-size:17px;margin-bottom:6px;color:var(--text);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:18px;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:15px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.modal-header h2{font-size:16px;font-weight:700;}
.btn-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:5px;line-height:1;}
.btn-close:hover{color:var(--text);}
.modal-preview{width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:7px;background:var(--bg);margin-bottom:10px;}
.modal-info{font-size:12px;color:var(--muted);margin-bottom:12px;}
.modal-warn{color:var(--warn);font-size:12px;margin-bottom:10px;padding:7px 11px;background:rgba(255,179,64,.08);border:1px solid rgba(255,179,64,.25);border-radius:7px;}
.modal-modes{display:flex;flex-direction:column;gap:7px;}
.mode-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;text-align:left;transition:all .15s;font-family:inherit;width:100%;}
.mode-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(0,200,224,.06);}
.mode-btn:disabled{opacity:.35;cursor:not-allowed;}
.mode-icon{font-size:24px;flex-shrink:0;width:32px;text-align:center;}
.mode-name{font-weight:600;font-size:13px;display:block;}
.mode-desc{font-size:11px;color:var(--muted);margin-top:1px;display:block;}
.editor-view{display:flex;flex-direction:column;height:100vh;}
.editor-layout{display:flex;flex:1;overflow:hidden;}
.editor-main{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:flex-start;padding:12px;gap:8px;background:var(--bg);}
.editor-sidebar{width:290px;min-width:290px;overflow-y:auto;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.sidebar-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:7px;}
.count-badge{background:var(--accent);color:#000;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;}
.empty-hint{font-size:12px;color:var(--muted);line-height:1.6;}
.tool-bar{display:flex;gap:4px;align-items:center;padding:6px 9px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);align-self:stretch;flex-wrap:wrap;}
.tool-btn{padding:4px 8px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;}
.tool-btn:hover{border-color:var(--accent);color:var(--text);}
.tool-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;}
.tool-sep{width:1px;height:16px;background:var(--border);flex-shrink:0;}
.tool-hint{font-size:11px;color:var(--warn);padding:2px 7px;background:rgba(255,179,64,.1);border:1px solid rgba(255,179,64,.3);border-radius:4px;}
.color-palette{display:flex;gap:3px;align-items:center;flex-wrap:wrap;}
.color-swatch{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;}
.color-swatch:hover{transform:scale(1.25);}.color-swatch.active{border-color:#fff;transform:scale(1.2);}
.color-swatch.ring{border-color:rgba(255,255,255,.35);}
.upload-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--border);border-radius:13px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;min-height:260px;min-width:320px;max-width:560px;width:100%;margin:0 auto;}
.upload-zone:hover{border-color:var(--accent);background:rgba(0,200,224,.04);}
.upload-icon{font-size:48px;margin-bottom:12px;}
.upload-zone h3{font-size:16px;margin-bottom:6px;}
.upload-zone p{color:var(--muted);font-size:12px;}
/* Le cadre prend EXACTEMENT le ratio de l'image (--ar) : marqueurs, flèches et clics restent alignés quel que soit le zoom */
.img-wrapper{--s:1;--ps:1;--ts:1;--zoom:1;--maxh:calc(100vh - 120px);position:relative;display:block;flex-shrink:0;margin:0 auto;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--border);aspect-ratio:var(--ar,1.3333);width:calc(min(100%,var(--maxh)*var(--ar,1.3333))*var(--zoom));}
.editor-main .img-wrapper{--maxh:calc(100vh - 220px);}
.main-img,.main-img-ex{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;}
.arrow-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.cursor-pin .main-img,.cursor-pin .main-img-ex{cursor:crosshair;}
.cursor-text-tool .main-img{cursor:text;}
.cursor-draw .main-img{cursor:crosshair;}
.cursor-locate .main-img-ex{cursor:crosshair;}
.marker-pin{position:absolute;transform:translate(-50%,-50%);width:calc(26px*var(--ps,1));height:calc(26px*var(--ps,1));border-radius:50%;background:rgba(6,16,30,.92);border:2px solid;color:#fff;font-size:calc(10px*var(--ps,1));font-weight:800;font-family:monospace;display:flex;align-items:center;justify-content:center;z-index:10;user-select:none;pointer-events:auto;cursor:default;}
.marker-pin.editable{cursor:grab;}.marker-pin.editable:hover{transform:translate(-50%,-50%) scale(1.2);}.marker-pin.editable:active{cursor:grabbing;}
.marker-pin.selected{outline:3px solid rgba(255,179,64,.9);outline-offset:2px;}
.marker-pin.show-correct{width:32px;height:32px;font-size:14px;z-index:20;}
.marker-pin.highlight{
  transform:translate(-50%,-50%) scale(1.5)!important;
  box-shadow:0 0 0 4px rgba(255,179,64,.6),0 0 22px rgba(255,179,64,.9)!important;
  border-color:var(--warn)!important;
  z-index:15;
  animation:pinPulse 1s ease-in-out infinite;
}
@keyframes pinPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1.5);}
  50%{transform:translate(-50%,-50%) scale(1.7);}
}
.tip-handle{position:absolute;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:rgba(6,16,30,.9);border:2px solid var(--warn);cursor:grab;z-index:12;pointer-events:auto;box-shadow:0 0 7px rgba(255,179,64,.6);}
.tip-handle:hover{transform:translate(-50%,-50%) scale(1.3);}
.brace-handle{position:absolute;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:rgba(6,16,30,.9);border:2px solid;cursor:grab;z-index:12;pointer-events:auto;}
.brace-handle:hover{transform:translate(-50%,-50%) scale(1.4);}
.brace-mid{width:14px;height:14px;border-radius:3px;}
.brace-tip{width:14px;height:14px;border-color:var(--success);background:rgba(0,224,154,.35);box-shadow:0 0 7px rgba(0,224,154,.7);cursor:alias;}
.text-annotation{position:absolute;transform:translate(0,-50%);font-weight:600;font-family:'Segoe UI',sans-serif;font-size:calc(var(--fs,14)*1px*var(--ts,1));line-height:1.25;background:rgba(6,16,30,.72);padding:calc(2px*var(--ts,1)) calc(6px*var(--ts,1));border-radius:calc(4px*var(--ts,1));cursor:default;pointer-events:auto;z-index:9;white-space:pre;}
.text-annotation.bg-light{background:rgba(255,255,255,.82);}
.text-annotation.bg-none{background:transparent;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 -1px 0 #000,0 1px 0 #000,-1px 0 0 #000,1px 0 0 #000;}
.cursor-draw .marker-pin.editable{cursor:crosshair;}
.color-swatch.auto{background:conic-gradient(#00c8e0,#00e09a,#ffb340,#ff4d6a,#8b5cf6,#00c8e0);}
.dir-seg{display:inline-flex;}
.dir-btn{padding:2px 9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;font-family:inherit;line-height:1.3;}
.dir-btn+.dir-btn{margin-left:-1px;}.dir-btn:first-child{border-radius:6px 0 0 6px;}.dir-btn:last-child{border-radius:0 6px 6px 0;}
.dir-btn:hover{color:var(--text);border-color:var(--accent);position:relative;}.dir-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700;}
.text-annotation.editable{cursor:grab;}.text-annotation.editable:hover{outline:1px dashed var(--warn);outline-offset:2px;}
.text-annotation.selected{outline:2px solid var(--warn);outline-offset:2px;}
.click-indicator{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;z-index:20;pointer-events:none;animation:popIn .2s ease-out;}
.click-ok{background:rgba(0,224,154,.9);border:2px solid var(--success);color:#000;}
.click-ko{background:rgba(255,77,106,.9);border:2px solid var(--error);color:#fff;}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(.4);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.ml-item{padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s;}
.ml-item:hover{border-color:var(--muted);}.ml-selected{border-color:var(--warn)!important;background:rgba(255,179,64,.03);}
.ml-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.ml-num{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;font-family:monospace;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,0,0,.4);border:2px solid;}
.ml-body{flex:1;min-width:0;}
.ml-alias-list{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
.ml-alias-row{display:flex;gap:3px;align-items:center;}
.ml-actions{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.exercise-view{display:flex;flex-direction:column;height:100vh;}
.exercise-layout{display:flex;flex:1;overflow:hidden;}
.exercise-img-area{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;padding:16px;background:var(--bg);}
.exercise-img-area .img-wrapper{margin:auto;}
.exercise-panel{width:320px;min-width:320px;overflow-y:auto;background:var(--bg2);border-left:1px solid var(--border);padding:15px;display:flex;flex-direction:column;gap:8px;}
.panel-title{font-size:14px;font-weight:700;}
.panel-sub{font-size:12px;color:var(--muted);line-height:1.5;}
.panel-footer{display:flex;gap:6px;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--border);margin-top:auto;}
.fill-list{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto;}
.fill-row{display:flex;align-items:center;gap:6px;}
.fill-num{width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;font-family:monospace;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,0,0,.35);border:2px solid;}
.reveal-list{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;}
.reveal-row{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;cursor:pointer;}
.reveal-row:hover{border-color:var(--muted);}
.reveal-num{width:21px;height:21px;border-radius:50%;font-size:10px;font-weight:700;font-family:monospace;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,0,0,.35);border:2px solid;}
.reveal-body{flex:1;min-width:0;}
.reveal-label{font-size:13px;font-weight:600;transition:filter .35s;word-break:break-word;}
.reveal-aliases{font-size:11px;color:var(--muted);margin-top:1px;transition:filter .35s;}
.blurred{filter:blur(5px);user-select:none;}
.reveal-icon{font-size:14px;flex-shrink:0;opacity:.5;}
.locate-panel{width:265px;min-width:265px;padding:15px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.locate-target{font-size:18px;font-weight:800;color:var(--accent);padding:13px;background:rgba(0,200,224,.08);border:1px solid rgba(0,200,224,.25);border-radius:var(--radius);text-align:center;line-height:1.3;word-break:break-word;}
.locate-pb{height:4px;background:var(--border);border-radius:3px;overflow:hidden;}
.locate-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:3px;}
.locate-ptext{font-size:11px;color:var(--muted);text-align:center;}
.locate-history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.hist-item{font-size:11px;padding:3px 7px;border-radius:4px;}
.hist-item.ok{color:var(--success);background:rgba(0,224,154,.07);}
.hist-item.ko{color:var(--error);background:rgba(255,77,106,.07);}
.score-view{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto;}
.score-card{border:2px solid;border-radius:14px;padding:28px;text-align:center;max-width:440px;width:100%;background:var(--bg2);}
.score-big{font-size:40px;font-weight:800;font-family:monospace;}
.score-pct{font-size:18px;font-weight:600;}
.score-msg{font-size:13px;margin-top:4px;}
.score-det{display:flex;flex-direction:column;gap:3px;margin:16px 0;text-align:left;max-height:260px;overflow-y:auto;}
.score-det-row{display:flex;align-items:flex-start;gap:6px;padding:5px 9px;border-radius:6px;font-size:12px;}
.score-det-row.ok{background:rgba(0,224,154,.07);color:var(--success);}
.score-det-row.ko{background:rgba(255,77,106,.07);color:var(--error);}
.score-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
.tolerance-info{font-size:11px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:4px 8px;line-height:1.5;}
.tolerance-info strong{color:var(--accent);}
/* draw tool options bar */
.draw-opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 9px;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:7px;align-self:stretch;}
.draw-opts label{font-size:10px;color:var(--muted);}

</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;background:#06101e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:99999;transition:opacity .4s">
  <div style="font-size:42px">🔬</div>

<script>

'use strict';

/* ══ SPLASH ══ */
function splashMsg(msg, pct){
  const bar=document.getElementById('splash-bar');
  const txt=document.getElementById('splash-msg');
  if(bar) bar.style.width=pct+'%';
  if(txt) txt.textContent=msg;
}
function splashDone(){
  const splash=document.getElementById('splash');
  const app=document.getElementById('app');
  if(app) app.style.opacity='1';
  if(splash){ splash.style.opacity='0'; setTimeout(()=>{ if(splash.parentNode) splash.parentNode.removeChild(splash); },450); }
}

/* ══ CONSTANTS ══ */
const STORAGE_KEY='anatomylab_v5';
const SCORES_KEY='anatomylab_scores_v1';
const VAL_PROGRESS_KEY='anatomylab_val_progress';
const HIT_RADIUS=0.065;
const SEMESTERS=['S1','S2','S3','S4','S5','S6','Autre'];
const SEM_COLORS={S1:'#8b5cf6',S2:'#00c8e0',S3:'#00e09a',S4:'#ffb340',S5:'#f97316',S6:'#ec4899',Autre:'#6366f1'};
const PIN_COLORS=['#00c8e0','#00e09a','#ff4d6a','#ffb340','#f97316','#ec4899','#8b5cf6','#a78bfa','#fde68a','#60a5fa','#6ee7b7','#fca5a5','#ffffff','#cccccc','#888888','#444444','#222222','#000000'];
const TEXT_COLORS=['#ffffff','#fde68a','#00e09a','#ff4d6a','#00c8e0','#ec4899','#ffb340','#000000'];
const BG_PRESETS=['transparent','#ffffff','#f8f6f0','#e8e8e8','#1a1a2e','#0d1928','#000000'];
const BRACE_COLORS=['#00c8e0','#00e09a','#ffb340','#ff4d6a','#ec4899','#ffffff','#000000'];
const ALL_COLORS=['#00c8e0','#00e09a','#ff4d6a','#ffb340','#f97316','#ec4899','#8b5cf6','#ffffff','#000000','#888888'];
const DRAW_TOOLS=['line','freehand','circle','cross'];
const TOOL_ICONS={line:'—',freehand:'✏️',circle:'○',cross:'✕',brace:'⌐',pin:'📍',text:'T',select:'↖'};
function needsRing(c){return['#ffffff','#cccccc','#fde68a','#f8f6f0','#e8e8e8'].includes(c);}

/* ══ ÉCHELLE DES ANNOTATIONS (suit la taille réelle de l'image affichée) ══ */
const REF_W=900; // largeur d'image de référence : à 900 px d'affichage, 1 "px" d'annotation = 1 px écran
function annotScales(r){const s=r.width/REF_W;return{s,ps:Math.min(2.4,Math.max(.7,s)),ts:Math.min(3,Math.max(.55,s))};}
function normAng(a){return((a+180)%360+360)%360-180;}
function snapAng(a){a=normAng(a);const t=Math.round(a/90)*90;return normAng(Math.abs(a-t)<4?t:a);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function clamp01(v){return Math.max(0,Math.min(1,v));}

/* ══ RÉGLAGES PAR DÉFAUT (mémorisés) ══ */
const DEF0={arrowColor:'',arrowWidth:3,arrowOutline:'',braceWidth:2,braceFont:13,braceDir:'right',textSize:14,textBg:'dark'};
const DEFAULTS_KEY='anatomylab_defaults_v1';
function loadDefaults(){try{return Object.assign({},DEF0,JSON.parse(localStorage.getItem(DEFAULTS_KEY)||'{}'));}catch(e){return Object.assign({},DEF0);}}
function saveDefaults(){try{localStorage.setItem(DEFAULTS_KEY,JSON.stringify(S.defaults));}catch(e){}}
/* couleur effective d'une flèche : '' = même couleur que son marqueur */
function arrowCol(m,a){return a.color||m.color||'#00c8e0';}
function wrapStyle(sc,extra){return bgStyle(sc)+';--ar:'+(sc.ar||1.3333)+(extra||'');}


/* ══ CAPTURE CLEAN SOURCE before any rendering ══ */
// _ORIG_SRC removed - export now uses document.scripts directly

/* ══ STATE ══ */
let S={
  schemas:[],view:'home',editorId:null,exerciseSchemaId:null,exerciseModalOpen:false,
  filter:{semester:'all',search:''},
  editor:{
    tool:'select',
    selectedMarkerId:null,selectedTextId:null,selectedBraceId:null,
    activeColor:PIN_COLORS[0],activeTextColor:TEXT_COLORS[0],activeBraceColor:BRACE_COLORS[0],
    /* draw tool state */
    drawColor:'#ff4d6a',drawWidth:2,drawDash:'',
    drawDraft:null,   // live preview data while dragging
    drawPoints:[],    // for freehand
    drawStart:null,   // {x,y} for line/circle
    zoom:1,arrowFrom:null,
  },
  ex:{mode:null,schemaId:null,groups:[],answers:{},submitted:false,score:null,
      revealed:{},locateQueue:[],locateIdx:0,locateResults:[],locateDone:false,
      feedback:null,feedbackTimeout:null},
};
S.defaults=loadDefaults();

/* ══ UTILS ══ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-_'`]/g,' ').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();}
function isCorrect(ans,marker){
  const n=norm(ans);if(!n)return false;
  const ns=normNoSp(ans);
  const all=[marker.label,...(marker.aliases||[])].filter(l=>l&&l.trim());
  return all.some(l=>{
    const ln=norm(l);
    if(ln===n)return true;               // exact match (with spaces)
    if(normNoSp(l)===ns)return true;     // match ignoring spaces (subclavière = sub clavière)
    return false;
  });
}
function normNoSp(s){ return norm(s).replace(/\s/g,''); }

function getSemColor(s){return SEM_COLORS[s]||'#5a7fa0';}
function pinText(bg){const h=(bg||'').replace('#','');if(h.length!==6)return'#fff';const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return(0.299*r+0.587*g+0.114*b)>160?'#000':'#fff';}
function getDisplayNum(all,m){const seen=[];for(const x of all){if(!seen.includes(x.groupId))seen.push(x.groupId);if(x.id===m.id)return seen.indexOf(m.groupId)+1;}return'?';}
function buildGroups(markers){const map={},order=[];for(const m of markers){if(!m.label.trim())continue;if(!map[m.groupId]){map[m.groupId]={groupId:m.groupId,markers:[],label:m.label,aliases:m.aliases||[]};order.push(m.groupId);}map[m.groupId].markers.push(m);}return order.map(g=>map[g]);}
function showToast(msg,type='info'){const t=document.getElementById('toast');if(!t)return;t.className='show toast-'+type;t.textContent=msg;clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),3200);}
function bgStyle(sc){return 'background:'+(sc&&sc.bgColor&&sc.bgColor!=='transparent'?sc.bgColor:'transparent');}

/* ══ IMAGE COMPRESSION ══ */
function compressImage(file){return new Promise(resolve=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const MAX=1400;if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}const cvs=document.createElement('canvas');cvs.width=w;cvs.height=h;const ctx2=cvs.getContext('2d');const isPng=file.type==='image/png'||file.name?.toLowerCase().endsWith('.png');if(!isPng){ctx2.fillStyle='#fff';ctx2.fillRect(0,0,w,h);}ctx2.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(isPng?cvs.toDataURL('image/png'):cvs.toDataURL('image/jpeg',0.82));};img.onerror=()=>{URL.revokeObjectURL(url);const r=new FileReader();r.onload=e=>resolve(e.target.result);r.readAsDataURL(file);};img.src=url;});}

/* ══ STORAGE ══ */
function storageInfo(){try{const u=new Blob([localStorage.getItem(STORAGE_KEY)||'']).size;return{u,pct:Math.min(100,Math.round(u/5e6*100))};}catch{return{u:0,pct:0};}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({schemas:S.schemas}));}catch(e){showToast('⚠️ Stockage plein — exportez !','warn');}undoRecord();}
function load(){
  splashMsg('Recherche des schémas…', 10);
  // 1. Try schema.js side-by-side file (works from file:// — Chrome, Brave, Edge)
  if(window.ANATOMY_SCHEMAS&&Array.isArray(window.ANATOMY_SCHEMAS)&&window.ANATOMY_SCHEMAS.length){
    splashMsg('Chargement de schema.js ('+window.ANATOMY_SCHEMAS.length+' schémas)…', 30);
    const total=window.ANATOMY_SCHEMAS.length;
    S.schemas=window.ANATOMY_SCHEMAS.map((sc,i)=>{
      if(i%10===0) splashMsg('Migration '+i+'/'+total+'…', 30+Math.round(i/total*55));
      return migrate(sc);
    });
    splashMsg('Finalisation…', 90);
    console.log('[AnatomyLab] Loaded from schema.js:',S.schemas.length,'schemas');
    save();
    return;
  }
  // 2. Try localStorage
  splashMsg('Chargement depuis la mémoire locale…', 40);
  try{
    const raw=localStorage.getItem(STORAGE_KEY)||'{}';
    splashMsg('Déchiffrement des données…', 60);
    const d=JSON.parse(raw);
    const total=(d.schemas||[]).length;
    S.schemas=(d.schemas||[]).map((sc,i)=>{
      if(i%10===0) splashMsg('Migration '+i+'/'+total+'…', 60+Math.round(i/total*25));
      return migrate(sc);
    });
    console.log('[AnatomyLab] Loaded from localStorage:',S.schemas.length,'schemas');
  }catch(e){S.schemas=[];}
}
// Try to auto-load schema.json (works on HTTP/HTTPS, blocked on file://)
function tryAutoLoad(){
  if(!window.fetch)return;
  const isFileProto=location.protocol==='file:';
  if(isFileProto){
    console.log('[AnatomyLab] file:// protocol — auto-fetch disabled (CORS). Use 📂 Importer JSON or push to GitHub Pages.');
    if(!S.schemas.length)render(); // re-render to show import prompt
    return;
  }
  fetch('./schema.json')
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(d=>{
      if(!d||!d.schemas)throw new Error('Invalid JSON');
      const imported=d.schemas.map(migrate);
      if(!imported.length)return;
      const newOnes=imported.filter(imp=>!S.schemas.some(ex=>ex.title===imp.title&&ex.semester===imp.semester));
      if(!newOnes.length){console.log('[AnatomyLab] schema.json already up to date');return;}
      S.schemas=[...S.schemas,...newOnes];
      save();
      console.log('[AnatomyLab] Auto-loaded schema.json:',newOnes.length,'new schemas');
      showToast('✅ schema.json chargé ('+newOnes.length+' schémas)','success');
      render();
    })
    .catch(e=>console.log('[AnatomyLab] schema.json:',e.message));
}

/* ══ MIGRATION ══ */
function migrate(sc){
  if(!sc.texts)sc.texts=[];if(!sc.braces)sc.braces=[];if(!sc.shapes)sc.shapes=[];if(!sc.bgColor)sc.bgColor='transparent';
  sc.markers.forEach(m=>{
    if(!m.aliases)m.aliases=[];if(!m.color)m.color=PIN_COLORS[0];if(!m.groupId)m.groupId=m.id;
    if(!m.arrows){m.arrows=[];if(m.arrowTip){m.arrows.push({id:uid(),x:m.arrowTip.x,y:m.arrowTip.y,color:'',width:3,outline:''});delete m.arrowTip;}}
    m.arrows.forEach(a=>{if(!a.id)a.id=uid();if(a.color===undefined||a.color===null||a.color===m.color)a.color='';if(!a.width)a.width=2;if(a.outline===undefined)a.outline='';});
  });
  sc.texts.forEach(t=>{if(!t.fontSize)t.fontSize=14;if(!t.bg)t.bg='dark';});
  sc.braces.forEach(b=>{if(!b.color)b.color=BRACE_COLORS[0];if(!b.lineWidth)b.lineWidth=2;if(!b.fontSize)b.fontSize=13;if(b.angle===undefined)b.angle=0;if(b.side==='left')b.angle=normAng(b.angle+180);b.side='right';if(b.y1>b.y2){const t=b.y1;b.y1=b.y2;b.y2=t;}});
  sc.shapes.forEach(sh=>{if(!sh.id)sh.id=uid();if(!sh.color)sh.color='#ff4d6a';if(!sh.lineWidth)sh.lineWidth=2;if(!sh.dash)sh.dash='';});
  return sc;
}

/* ══ EXPORT / IMPORT ══ */
function exportSchemaJS(){
  // Creates schema.js — place it next to AnatomyLab.html for auto-loading from file://
  const data=JSON.stringify(S.schemas,null,2);
  const js='// AnatomyLab — données auto-chargées\n// Placez ce fichier dans le même dossier que AnatomyLab.html\nwindow.ANATOMY_SCHEMAS = '+data+';\n';
  const b=new Blob([js],{type:'application/javascript'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='schema.js';document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(u);
  showToast('✅ schema.js exporté — placez-le à côté du HTML','success');
}
function exportJSON(){const b=new Blob([JSON.stringify({schemas:S.schemas},null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='anatomylab_sauvegarde.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);showToast('✅ JSON exporté','success');}
function importJSON(file){const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.schemas)throw 0;S.schemas=d.schemas.map(migrate);save();showToast('✅ Import OK — '+d.schemas.length+' schémas','success');render();}catch{showToast('❌ JSON invalide','error');}};r.readAsText(file);}
function exportStandalone(){
  // Export disabled: standalone HTML export is blocked by Chrome file:// security.
  // Use "Sauvegarder JSON" instead, then place schema.json next to the HTML file.
  showToast('Utilisez 💾 Sauvegarder JSON — voir instructions ci-dessous','warn');
}

/* ══ CRUD ══ */
function getSchema(id){return S.schemas.find(s=>s.id===id);}
function createSchema(){const s={id:uid(),title:'Nouveau schéma',category:'',semester:'S1',imageData:null,bgColor:'transparent',markers:[],texts:[],braces:[],shapes:[]};S.schemas.push(s);save();return s;}
function deleteSchema(id){S.schemas=S.schemas.filter(s=>s.id!==id);save();}
function addMarker(sid,x,y,color){const sc=getSchema(sid);if(!sc)return;const id=uid();const m={id,groupId:id,x,y,label:'',aliases:[],color:color||PIN_COLORS[0],arrows:[]};sc.markers.push(m);save();return m;}
function deleteMarker(sid,mid){const sc=getSchema(sid);if(!sc)return;sc.markers=sc.markers.filter(m=>m.id!==mid);save();}
function updateMarker(sid,mid,f){const sc=getSchema(sid);if(!sc)return;const m=sc.markers.find(m=>m.id===mid);if(!m)return;Object.assign(m,f);save();}
function addGroupMarker(sid,srcId){const sc=getSchema(sid);if(!sc)return;const s=sc.markers.find(m=>m.id===srcId);if(!s)return;const m={id:uid(),groupId:s.groupId,x:Math.min(s.x+0.05,0.95),y:Math.min(s.y+0.05,0.95),label:s.label,aliases:[...s.aliases],color:s.color,arrows:[]};sc.markers.push(m);save();return m;}
function addArrow(sid,mid,x,y){const sc=getSchema(sid);if(!sc)return;const m=sc.markers.find(m=>m.id===mid);if(!m)return;if(!m.arrows)m.arrows=[];const d=S.defaults;const a={id:uid(),x:x!==undefined?x:Math.min(m.x+0.08,0.95),y:y!==undefined?y:Math.min(m.y+0.08,0.95),color:d.arrowColor||'',width:d.arrowWidth,outline:d.arrowOutline||''};m.arrows.push(a);save();return a;}
function deleteArrow(sid,mid,aid){const sc=getSchema(sid);if(!sc)return;const m=sc.markers.find(m=>m.id===mid);if(!m)return;m.arrows=m.arrows.filter(a=>a.id!==aid);save();}
function updateArrow(sid,mid,aid,f){const sc=getSchema(sid);if(!sc)return;const m=sc.markers.find(m=>m.id===mid);if(!m)return;const a=m.arrows.find(a=>a.id===aid);if(!a)return;Object.assign(a,f);save();}
function addText(sid,x,y,color){const sc=getSchema(sid);if(!sc)return;if(!sc.texts)sc.texts=[];const t={id:uid(),x,y,text:'Texte',color:color||TEXT_COLORS[0],fontSize:S.defaults.textSize,bg:S.defaults.textBg};sc.texts.push(t);save();return t;}
function deleteText(sid,tid){const sc=getSchema(sid);if(!sc)return;sc.texts=(sc.texts||[]).filter(t=>t.id!==tid);save();}
function updateText(sid,tid,f){const sc=getSchema(sid);if(!sc)return;const t=(sc.texts||[]).find(t=>t.id===tid);if(!t)return;Object.assign(t,f);save();}
function addBrace(sid,x,y1,y2,color,angle){const sc=getSchema(sid);if(!sc)return;if(!sc.braces)sc.braces=[];const d=S.defaults;const b={id:uid(),x,y1,y2,side:'right',label:'',color:color||BRACE_COLORS[0],lineWidth:d.braceWidth,fontSize:d.braceFont,angle:angle||0};sc.braces.push(b);save();return b;}
function deleteBrace(sid,bid){const sc=getSchema(sid);if(!sc)return;sc.braces=(sc.braces||[]).filter(b=>b.id!==bid);save();}
function updateBrace(sid,bid,f){const sc=getSchema(sid);if(!sc)return;const b=(sc.braces||[]).find(b=>b.id===bid);if(!b)return;Object.assign(b,f);save();}
function addShape(sid,sh){const sc=getSchema(sid);if(!sc)return;if(!sc.shapes)sc.shapes=[];sc.shapes.push({...sh,id:uid()});save();}
function deleteShape(sid,shid){const sc=getSchema(sid);if(!sc)return;sc.shapes=(sc.shapes||[]).filter(s=>s.id!==shid);save();}
function updateShape(sid,shid,f){const sc=getSchema(sid);if(!sc)return;const s=(sc.shapes||[]).find(s=>s.id===shid);if(!s)return;Object.assign(s,f);save();}

/* ══ DRAWING ══ */
function applyDash(ctx,dash,k){
  k=k||1;
  if(dash==='dashed')ctx.setLineDash([10*k,6*k]);
  else if(dash==='dotted')ctx.setLineDash([2*k,6*k]);
  else ctx.setLineDash([]);
}
function drawArrow(ctx,r,x1n,y1n,x2n,y2n,color,width,outline){
  const k=annotScales(r).s,W=width||2;
  const x1=x1n*r.width,y1=y1n*r.height,x2=x2n*r.width,y2=y2n*r.height;
  const w=Math.max(.8,W*k),hs=(8+W*1.2)*k,ang=Math.atan2(y2-y1,x2-x1);
  const bx=x2-Math.cos(ang)*hs*.7,by=y2-Math.sin(ang)*hs*.7;
  const h1x=x2-hs*Math.cos(ang-.38),h1y=y2-hs*Math.sin(ang-.38),h2x=x2-hs*Math.cos(ang+.38),h2y=y2-hs*Math.sin(ang+.38);
  function pass(col,lw,strokeHead){
    ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(bx,by);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(h1x,h1y);ctx.lineTo(h2x,h2y);ctx.closePath();ctx.fill();if(strokeHead)ctx.stroke();
    ctx.restore();
  }
  if(outline)pass(outline,w+3*k,true);
  pass(color||'#00c8e0',w,false);
}
/* Géométrie d'une accolade, en pixels.
   Modèle : centre (x,(y1+y2)/2), longueur |y2-y1|, angle = direction de la pointe
   (0°=droite, 90°=bas, -90°=haut, ±180°=gauche) — n'importe quelle valeur = orientation libre. */
function braceGeom(br,r){
  const k=annotScales(r).s,w=r.width,h=r.height;
  const cx=br.x*w,cy=(br.y1+br.y2)/2*h,L=Math.abs(br.y2-br.y1)*h;
  const th=(br.angle||0)*Math.PI/180,tx=Math.cos(th),ty=Math.sin(th),dx=-ty,dy=tx;
  const arm=Math.max(9*k,Math.min(22*k,L*0.14));
  return{k,cx,cy,L,th,tx,ty,dx,dy,arm,
    ax:cx-dx*L/2,ay:cy-dy*L/2,bx:cx+dx*L/2,by:cy+dy*L/2,
    tipx:cx+tx*arm*2,tipy:cy+ty*arm*2};
}
function drawOutlinedText(ctx,text,x,y,fs,fill){
  ctx.save();ctx.lineJoin='round';ctx.lineWidth=Math.max(2,fs*.22);ctx.strokeStyle='rgba(0,0,0,.85)';
  ctx.strokeText(text,x,y);ctx.fillStyle=fill;ctx.fillText(text,x,y);ctx.restore();
}
function drawCurlyBrace(ctx,r,br){
  const g=braceGeom(br,r),h=g.L,a=g.arm,y1=-h/2,y2=h/2;
  ctx.save();
  ctx.translate(g.cx,g.cy);ctx.rotate(g.th);
  ctx.strokeStyle=br.color||'#00c8e0';ctx.lineWidth=Math.max(.8,(br.lineWidth||2)*g.k);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(0,y1);
  ctx.quadraticCurveTo(0,y1+h*0.25,a,y1+h*0.25);
  ctx.quadraticCurveTo(a,0,a*2,0);
  ctx.quadraticCurveTo(a,0,a,y2-h*0.25);
  ctx.quadraticCurveTo(0,y2-h*0.25,0,y2);
  ctx.stroke();
  ctx.restore();
  if(br.label){
    const ts=annotScales(r).ts,fs=(br.fontSize||13)*ts;
    const lx=g.cx+g.tx*a*2.6,ly=g.cy+g.ty*a*2.6;
    ctx.save();
    ctx.font='600 '+fs+'px \'Segoe UI\',sans-serif';
    ctx.textAlign=g.tx>0.35?'left':g.tx<-0.35?'right':'center';
    ctx.textBaseline=g.ty>0.35?'top':g.ty<-0.35?'bottom':'middle';
    drawOutlinedText(ctx,br.label,lx,ly,fs,br.color||'#00c8e0');
    ctx.restore();
  }
}
function drawShape(ctx,r,sh){
  const k=annotScales(r).s;
  ctx.save();
  ctx.strokeStyle=sh.color||'#ff4d6a';ctx.lineWidth=Math.max(.8,(sh.lineWidth||2)*k);ctx.lineCap='round';ctx.lineJoin='round';
  applyDash(ctx,sh.dash,k);
  if(sh.type==='line'){
    ctx.beginPath();ctx.moveTo(sh.x1*r.width,sh.y1*r.height);ctx.lineTo(sh.x2*r.width,sh.y2*r.height);ctx.stroke();
  } else if(sh.type==='freehand'){
    if(!sh.pts||sh.pts.length<2){ctx.restore();return;}
    ctx.beginPath();ctx.moveTo(sh.pts[0].x*r.width,sh.pts[0].y*r.height);
    for(let i=1;i<sh.pts.length;i++)ctx.lineTo(sh.pts[i].x*r.width,sh.pts[i].y*r.height);
    ctx.stroke();
  } else if(sh.type==='circle'){
    ctx.beginPath();ctx.ellipse(sh.cx*r.width,sh.cy*r.height,sh.rx*r.width,sh.ry*r.height,0,0,Math.PI*2);ctx.stroke();
  } else if(sh.type==='cross'){
    const s=(sh.size||0.03)*Math.min(r.width,r.height);
    const cx=sh.x*r.width,cy=sh.y*r.height;
    ctx.beginPath();ctx.moveTo(cx-s,cy-s);ctx.lineTo(cx+s,cy+s);ctx.moveTo(cx+s,cy-s);ctx.lineTo(cx-s,cy+s);ctx.stroke();
  }
  ctx.setLineDash([]);ctx.restore();
}
function roundRect(ctx,x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath();}
/* Textes : même rendu que le calque HTML de l'éditeur (fond sombre / clair / contour seul), sans ombre floue */
function drawTexts(ctx,r,texts){
  const ts=annotScales(r).ts;
  (texts||[]).forEach(t=>{
    const fs=(t.fontSize||14)*ts;
    ctx.save();
    ctx.font='600 '+fs+'px \'Segoe UI\',sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
    const x=t.x*r.width,y=t.y*r.height,padX=6*ts,padY=2*ts,tw=ctx.measureText(t.text||'').width,h=fs*1.25+padY*2;
    const bg=t.bg||'dark';
    if(bg==='none'){drawOutlinedText(ctx,t.text||'',x+padX,y,fs,t.color||'#fff');}
    else{
      ctx.fillStyle=bg==='light'?'rgba(255,255,255,.82)':'rgba(6,16,30,.72)';
      roundRect(ctx,x,y-h/2,tw+padX*2,h,4*ts);ctx.fill();
      ctx.fillStyle=t.color||'#fff';ctx.fillText(t.text||'',x+padX,y);
    }
    ctx.restore();
  });
}
/* opts.noTexts : dans l'éditeur les textes sont des éléments HTML déplaçables → ne pas les redessiner sur le canvas (c'était le « texte sur le texte ») */
function drawAll(sc,imgEl,canvasEl,exMode,opts){
  if(!canvasEl||!imgEl)return;
  const r=imgEl.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const dpr=window.devicePixelRatio||1;
  canvasEl.width=Math.round(r.width*dpr);canvasEl.height=Math.round(r.height*dpr);
  const ctx=canvasEl.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);
  const markers=exMode?sc.markers.filter(m=>m.label.trim()):sc.markers;
  markers.forEach(m=>(m.arrows||[]).forEach(a=>drawArrow(ctx,r,m.x,m.y,a.x,a.y,arrowCol(m,a),a.width,a.outline)));
  (sc.braces||[]).forEach(b=>drawCurlyBrace(ctx,r,b));
  (sc.shapes||[]).forEach(sh=>drawShape(ctx,r,sh));
  if(!(opts&&opts.noTexts))drawTexts(ctx,r,sc.texts);
}
function redrawCanvas(){const sc=getSchema(S.editorId);if(!sc)return;drawAll(sc,document.getElementById('main-img'),document.getElementById('arrow-canvas'),false,{noTexts:true});}

/* ══ ACCOLADES : helpers ══ */
const BRACE_ANGLES={right:0,down:90,left:-180,up:-90};
function braceDirOf(b){const a=normAng(b.angle||0);for(const k in BRACE_ANGLES){if(Math.abs(a-BRACE_ANGLES[k])<.5)return k;}return'free';}
/* à partir de deux extrémités (en px) */
function braceFromEnds(b,Ax,Ay,Bx,By,r){
  const L=Math.hypot(Bx-Ax,By-Ay);if(L<3)return;
  const cx=(Ax+Bx)/2,cy=(Ay+By)/2,dx=(Bx-Ax)/L,dy=(By-Ay)/L;
  b.x=cx/r.width;b.y1=(cy-L/2)/r.height;b.y2=(cy+L/2)/r.height;
  b.angle=snapAng(Math.atan2(-dx,dy)*180/Math.PI);
}
/* création par glissé selon le sens par défaut (haut/bas/gauche/droite/libre) */
function makeBraceFromDrag(A,B,dir,r){
  const w=r.width,h=r.height,ax=A.x*w,ay=A.y*h,bx=B.x*w,by=B.y*h;
  if(dir==='left'||dir==='right'){const y1=Math.min(ay,by),y2=Math.max(ay,by);return{x:A.x,y1:y1/h,y2:y2/h,angle:BRACE_ANGLES[dir],len:y2-y1};}
  if(dir==='up'||dir==='down'){const L=Math.abs(bx-ax),cx=(ax+bx)/2;return{x:cx/w,y1:(ay-L/2)/h,y2:(ay+L/2)/h,angle:BRACE_ANGLES[dir],len:L};}
  const L=Math.hypot(bx-ax,by-ay)||1,cx=(ax+bx)/2,cy=(ay+by)/2,dx=(bx-ax)/L,dy=(by-ay)/L;
  return{x:cx/w,y1:(cy-L/2)/h,y2:(cy+L/2)/h,angle:snapAng(Math.atan2(-dx,dy)*180/Math.PI),len:L};
}
function layoutBraceHandles(){
  const sc=getSchema(S.editorId),img=document.getElementById('main-img');if(!sc||!img)return;
  const r=img.getBoundingClientRect();if(!r.width)return;
  (sc.braces||[]).forEach(b=>{
    const g=braceGeom(b,r);
    const put=(id,x,y)=>{const el=document.getElementById(id);if(el){el.style.left=(x/r.width*100)+'%';el.style.top=(y/r.height*100)+'%';}};
    put('bh-top-'+b.id,g.ax,g.ay);put('bh-bot-'+b.id,g.bx,g.by);put('bh-mid-'+b.id,g.cx,g.cy);put('bh-tip-'+b.id,g.tipx,g.tipy);
  });
}
function syncBraceSidebar(b){
  const sel=document.querySelector('[data-b-dir="'+b.id+'"]');if(sel)sel.value=braceDirOf(b);
  const rng=document.querySelector('[data-b-angle="'+b.id+'"]');if(rng)rng.value=Math.round(normAng(b.angle||0));
  const sp=document.getElementById('bangle-val-'+b.id);if(sp)sp.textContent=Math.round(normAng(b.angle||0))+'°';
}

/* ══ SCORES STORAGE ══ */
function loadScores(){try{return JSON.parse(localStorage.getItem(SCORES_KEY)||'[]');}catch{return[];}}
function saveScores(sessions){try{localStorage.setItem(SCORES_KEY,JSON.stringify(sessions));}catch(e){showToast('⚠️ Stockage scores plein','warn');}}

function promptExportScores(){
  const ue=prompt('Nom de l\'UE pour le fichier (ex: UE_2_2)','UE');
  if(ue!==null)exportScores(ue);
}
function exportScores(ueName){
  const sessions=loadScores();
  const now=new Date();
  const dateStr=String(now.getDate()).padStart(2,'0')+'_'+String(now.getMonth()+1).padStart(2,'0')+'_'+now.getFullYear();
  const safeName=(ueName||'UE').replace(/[^a-zA-Z0-9_\-]/g,'_').replace(/__+/g,'_');
  const filename=safeName+'___'+dateStr+'.json';
  const b=new Blob([JSON.stringify({ue:ueName,date:dateStr,sessions},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(u);
  showToast('✅ Scores exportés : '+filename,'success');
}

function importScoresFile(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const sessions=d.sessions||[];
      if(!Array.isArray(sessions))throw new Error();
      const existing=loadScores();
      // Merge by sessionId
      const merged=[...existing];
      sessions.forEach(s=>{if(!merged.find(x=>x.id===s.id))merged.push(s);});
      saveScores(merged);
      showToast('✅ Scores importés ('+sessions.length+' sessions)','success');
      render();
    }catch{showToast('❌ Fichier de scores invalide','error');}
  };r.readAsText(file);
}

function startValidation(mode,semFilter,targeted){
  let schemas=S.schemas.filter(s=>s.markers.some(m=>m.label.trim()));
  if(semFilter&&semFilter!=='all')schemas=schemas.filter(s=>s.semester===semFilter);
  if(!schemas.length){showToast('Aucun schéma disponible pour ce filtre','warn');return;}
  S.val={active:true,mode,semFilter,targeted:!!targeted,queue:shuffle(schemas).map(s=>({id:s.id,attempts:0})),done:[],sessionScores:{},currentSchemaId:null,_currentAttempts:0,_targetGroups:null,startTime:Date.now()};
  valNext();
}

function valNext(){
  if(!S.val.active)return;
  if(!S.val.queue.length){valFinish();return;}
  const item=S.val.queue.shift();
  S.val.currentSchemaId=item.id;
  S.val._currentAttempts=(item.attempts||0)+1;
  // Targeted mode: only wrong groups from previous attempt
  let tg=null;
  if(S.val.targeted&&item.attempts>0){
    const prev=S.val.sessionScores[item.id];
    if(prev&&prev.wrongGroups&&prev.wrongGroups.length){tg=prev.wrongGroups;}
  }
  S.val._targetGroups=tg;
  const mode=S.val.mode;
  if(mode==='fill')startEx(item.id,'fill',tg);
  else if(mode==='clickpin')startClickPin(item.id,tg);
  else startEx(item.id,'locate',tg);
}

function valSaveProgress(){
  try{localStorage.setItem(VAL_PROGRESS_KEY,JSON.stringify({
    mode:S.val.mode,semFilter:S.val.semFilter,
    queue:S.val.queue,done:S.val.done,
    sessionScores:S.val.sessionScores,startTime:S.val.startTime
  }));}catch(e){}
}
function valClearProgress(){try{localStorage.removeItem(VAL_PROGRESS_KEY);}catch(e){}}
function valHasSavedProgress(){
  try{const d=JSON.parse(localStorage.getItem(VAL_PROGRESS_KEY)||'null');return d&&d.queue&&(d.queue.length+d.done.length)>0?d:null;}catch{return null;}
}
function valResumeProgress(saved){
  S.val={active:true,mode:saved.mode,semFilter:saved.semFilter,targeted:!!saved.targeted,
    queue:saved.queue,done:saved.done,sessionScores:saved.sessionScores,
    currentSchemaId:null,_currentAttempts:0,startTime:saved.startTime||Date.now()};
  valNext();
}
function valComputeWrongGroups(){
  const ex=S.ex;if(!ex)return[];
  const mode=ex.mode;
  try{
    if(mode==='fill'){
      return ex.groups.filter(g=>!isCorrect(ex.answers[g.groupId]||'',g)&&!(ex.manualCorrect&&ex.manualCorrect[g.groupId])).map(g=>g.groupId);
    } else if(mode==='clickpin'){
      const wrongLabels=new Set(ex.cpResults.filter(r=>!r.correct&&!r.skipped).map(r=>r.label));
      return ex.groups.filter(g=>wrongLabels.has(g.label)).map(g=>g.groupId);
    } else {
      const wrongLabels=new Set(ex.locateResults.filter(r=>!r.correct&&!r.skipped).map(r=>r.label));
      return ex.groups.filter(g=>wrongLabels.has(g.label)).map(g=>g.groupId);
    }
  }catch{return[];}
}
function valRecordAndContinue(pct){
  if(!S.val.active)return;
  const sid=S.val.currentSchemaId;
  const sc=getSchema(sid);
  const prev=S.val.sessionScores[sid];
  const best=prev?Math.max(prev.score,pct):pct;
  const wrongGroups=S.val.targeted?valComputeWrongGroups():[];
  S.val.sessionScores[sid]={title:sc?sc.title:'?',semester:sc?sc.semester:'?',score:best,lastScore:pct,attempts:S.val._currentAttempts,wrongGroups};
  if(pct>=75){S.val.done.push(sid);}
  else{S.val.queue.push({id:sid,attempts:S.val._currentAttempts});}
  valSaveProgress();
  S.view='val-between';render();
}

function valFinish(){
  S.val.active=false;
  // Save session to localStorage
  const sessions=loadScores();
  const now=new Date();
  const dateStr=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear();
  sessions.push({id:Date.now().toString(36),date:dateStr,mode:S.val.mode,semFilter:S.val.semFilter,scores:S.val.sessionScores});
  valClearProgress();
  if(sessions.length>20)sessions.splice(0,sessions.length-20);
  saveScores(sessions);
  S.view='val-results';render();
}

function startEx(schemaId,mode,filterGroupIds){
  S.exerciseModalOpen=false;S.exerciseSchemaId=null;const sc=getSchema(schemaId);if(!sc)return;
  let allGroups=buildGroups(sc.markers.filter(m=>m.label.trim()));
  if(filterGroupIds&&filterGroupIds.length)allGroups=allGroups.filter(g=>filterGroupIds.includes(g.groupId));
  const shuffledGroups=shuffle(allGroups).map((g,i)=>({...g,displayNum:i+1}));
  S.ex={mode,schemaId,groups:shuffledGroups,answers:{},submitted:false,score:null,revealed:{},
        locateQueue:shuffle(shuffledGroups.map(g=>g.label)),locateIdx:0,locateResults:[],locateDone:false,feedback:null,feedbackTimeout:null,manualCorrect:{}};
  S.view=mode==='fill'?'ex-fill':mode==='reveal'?'ex-reveal':'ex-locate';render();
}

function doRenderSchema(sc,mode,action){
  const img=new Image();
  img.onload=()=>{
    const W=img.naturalWidth,H=img.naturalHeight;
    const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext('2d');

    // Background
    if(sc.bgColor&&sc.bgColor!=='transparent'){ctx.fillStyle=sc.bgColor;ctx.fillRect(0,0,W,H);}
    ctx.drawImage(img,0,0,W,H);

    if(mode!=='blank'){
      const r={width:W,height:H};
      // Draw arrows + braces + shapes + texts
      sc.markers.forEach(m=>(m.arrows||[]).forEach(a=>drawArrow(ctx,r,m.x,m.y,a.x,a.y,arrowCol(m,a),a.width,a.outline)));
      (sc.braces||[]).forEach(b=>drawCurlyBrace(ctx,r,b));
      (sc.shapes||[]).forEach(sh=>drawShape(ctx,r,sh));
      if(mode==='correction'){drawTexts(ctx,r,sc.texts);}
      // Draw marker pins
      sc.markers.forEach((m,idx)=>{
        const dispNum=getDisplayNum(sc.markers,m);
        const pinR=13*annotScales(r).ps;
        const x=m.x*W,y=m.y*H;
        ctx.save();
        ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;
        ctx.beginPath();ctx.arc(x,y,pinR,0,Math.PI*2);
        ctx.fillStyle='rgba(6,16,30,.92)';ctx.fill();
        ctx.strokeStyle=m.color||'#00c8e0';ctx.lineWidth=2.5;ctx.stroke();
        ctx.shadowBlur=0;
        // Number
        ctx.font=`800 ${Math.round(pinR*0.9)}px monospace`;
        ctx.fillStyle=pinText(m.color||'#00c8e0');
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(String(dispNum),x,y+1);
        // Correction label
        if(mode==='correction'&&m.label){
          const fs=Math.max(11,Math.min(16,W*0.013));
          ctx.font=`600 ${fs}px 'Segoe UI',sans-serif`;
          const tw=ctx.measureText(m.label).width;
          const lx=x+pinR+4,ly=y;
          ctx.fillStyle='rgba(6,16,30,.82)';
          ctx.fillRect(lx-3,ly-fs/2-3,tw+8,fs+6);
          ctx.strokeStyle=m.color||'#00c8e0';ctx.lineWidth=1;
          ctx.strokeRect(lx-3,ly-fs/2-3,tw+8,fs+6);
          ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';
          ctx.fillText(m.label,lx+1,ly+1);
        }
        ctx.restore();
      });
    }

    if(action==='save'){
      const a=document.createElement('a');
      const suffix=mode==='blank'?'vierge':mode==='markers'?'numerotee':'corrigee';
      a.download=(sc.title||'schema').replace(/[^a-z0-9]/gi,'_')+'_'+suffix+'.png';
      a.href=canvas.toDataURL('image/png');
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      showToast('✅ Image PNG enregistrée','success');
    } else {
      // Print
      const dataUrl=canvas.toDataURL('image/png');
      const win=window.open('','_blank');
      if(!win){showToast('⚠️ Autorisez les popups pour imprimer','warn');return;}
      win.document.write(`<!DOCTYPE html><html><head><title>${sc.title||'Schéma'}</title>
      <style>*{margin:0;padding:0;}body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff;}
      img{max-width:100%;max-height:100vh;object-fit:contain;}
      @media print{body{min-height:auto;}img{width:100%;height:auto;}}</style></head>
      <body><img src="${dataUrl}" onload="setTimeout(()=>{window.print();},200)"></body></html>`);
      win.document.close();
    }
  };
  img.crossOrigin='anonymous';
  img.src=sc.imageData;
}

/* ══ ANNULER / RÉTABLIR (éditeur) ══ */
const UNDO={stack:[],idx:-1,sid:null,timer:null,skip:false};
function undoSnap(){
  const sc=getSchema(S.editorId);if(!sc)return null;
  return JSON.stringify({markers:sc.markers,texts:sc.texts,braces:sc.braces,shapes:sc.shapes,bgColor:sc.bgColor});
}
function undoInit(){
  if(UNDO.sid===S.editorId)return;
  clearTimeout(UNDO.timer);UNDO.timer=null;
  UNDO.sid=S.editorId;const s=undoSnap();UNDO.stack=s?[s]:[];UNDO.idx=s?0:-1;
}
function undoReset(){clearTimeout(UNDO.timer);UNDO.timer=null;UNDO.sid=null;UNDO.stack=[];UNDO.idx=-1;}
function undoRecord(){
  if(UNDO.skip||S.view!=='editor'||UNDO.sid!==S.editorId)return;
  clearTimeout(UNDO.timer);UNDO.timer=setTimeout(undoCommit,350);
}
function undoCommit(){
  UNDO.timer=null;
  if(S.view!=='editor'||UNDO.sid!==S.editorId)return;
  const s=undoSnap();if(!s||s===UNDO.stack[UNDO.idx])return;
  UNDO.stack=UNDO.stack.slice(0,UNDO.idx+1);UNDO.stack.push(s);
  if(UNDO.stack.length>80)UNDO.stack.shift();
  UNDO.idx=UNDO.stack.length-1;
}
function undoApply(){
  const sc=getSchema(S.editorId),d=JSON.parse(UNDO.stack[UNDO.idx]);if(!sc)return;
  sc.markers=d.markers;sc.texts=d.texts;sc.braces=d.braces;sc.shapes=d.shapes;sc.bgColor=d.bgColor;
  const ed=S.editor;
  if(ed.selectedMarkerId&&!sc.markers.some(m=>m.id===ed.selectedMarkerId))ed.selectedMarkerId=null;
  if(ed.selectedTextId&&!sc.texts.some(t=>t.id===ed.selectedTextId))ed.selectedTextId=null;
  if(ed.selectedBraceId&&!sc.braces.some(b=>b.id===ed.selectedBraceId))ed.selectedBraceId=null;
  if(ed.arrowFrom&&!sc.markers.some(m=>m.id===ed.arrowFrom))ed.arrowFrom=null;
  UNDO.skip=true;save();UNDO.skip=false;
  renderEditor(document.getElementById('app'));
}
function undoAction(){
  if(S.view!=='editor')return;
  if(UNDO.timer){clearTimeout(UNDO.timer);undoCommit();}
  if(UNDO.idx<=0){showToast('Rien à annuler','warn');return;}
  UNDO.idx--;undoApply();
}
function redoAction(){
  if(S.view!=='editor')return;
  if(UNDO.timer){clearTimeout(UNDO.timer);undoCommit();}
  if(UNDO.idx>=UNDO.stack.length-1){showToast('Rien à rétablir','warn');return;}
  UNDO.idx++;undoApply();
}
document.addEventListener('keydown',e=>{
  if(S.view!=='editor')return;
  const tag=(e.target&&e.target.tagName)||'';
  const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&!typing&&(e.key==='z'||e.key==='Z')){e.preventDefault();e.shiftKey?redoAction():undoAction();return;}
  if(mod&&!typing&&(e.key==='y'||e.key==='Y')){e.preventDefault();redoAction();return;}
  if(typing)return;
  const ed=S.editor;
  if(e.key==='Escape'){ed.tool='select';ed.arrowFrom=null;ed.drawStart=null;ed.drawPoints=[];renderEditor(document.getElementById('app'));return;}
  if(e.key==='Delete'){
    const id=S.editorId;
    if(ed.selectedMarkerId){deleteMarker(id,ed.selectedMarkerId);ed.selectedMarkerId=null;renderEditor(document.getElementById('app'));}
    else if(ed.selectedBraceId){deleteBrace(id,ed.selectedBraceId);ed.selectedBraceId=null;renderEditor(document.getElementById('app'));}
    else if(ed.selectedTextId){deleteText(id,ed.selectedTextId);ed.selectedTextId=null;renderEditor(document.getElementById('app'));}
  }
});

function startArrowDrag(m,e0){
  const ed=S.editor,sx=e0.clientX,sy=e0.clientY;let moved=false;
  const mv=ev=>{
    if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>6)moved=true;if(!moved)return;
    const pos=getImgPos(ev);if(!pos)return;
    redrawCanvas();const cv=document.getElementById('arrow-canvas');if(!cv)return;
    drawArrow(cv.getContext('2d'),pos.r,m.x,m.y,pos.x,pos.y,S.defaults.arrowColor||m.color,S.defaults.arrowWidth,S.defaults.arrowOutline);
  };
  const up=ev=>{
    document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    if(moved){
      const pos=getImgPos(ev);
      if(pos){addArrow(S.editorId,m.id,pos.x,pos.y);ed._noClickUntil=performance.now()+200;renderEditor(document.getElementById('app'));return;}
    }
    redrawCanvas();
  };
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}
