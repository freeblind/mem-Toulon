<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UE 3.3 — Physique appliquée IRM : TD, TD alternatifs & flashcards</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mut:#5d6b7c;--line:#dde3ea;--acc:#0f766e;--acc2:#115e59;--accbg:#e6f4f2;
  --ok:#15803d;--okbg:#e7f6ec;--ko:#b45309;--kobg:#fdf1e1;--bad:#b91c1c;--badbg:#fde8e8;--c1:#2563eb;--c2:#ea580c;--shadow:0 1px 3px rgba(20,30,45,.08),0 4px 14px rgba(20,30,45,.05);
}
html[data-theme=dark]{
  --bg:#0f1620;--card:#18212d;--ink:#e6ecf3;--mut:#9aa8b8;--line:#2a3646;--acc:#2dd4bf;--acc2:#5eead4;--accbg:#13302d;
  --ok:#4ade80;--okbg:#12301f;--ko:#fbbf24;--kobg:#33270f;--bad:#f87171;--badbg:#3a1717;--c1:#60a5fa;--c2:#fb923c;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1000px;margin:0 auto;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:700;font-size:1.05rem;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:.75rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:9px;cursor:pointer;font-size:.88rem;line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
html[data-theme=dark] .btn.pri{color:#06201d}
.btn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.btn.ko{background:var(--kobg);border-color:var(--ko);color:var(--ko)}
.btn.sm{padding:3px 9px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:default}
.savebar{width:100%;font-size:.78rem;color:var(--mut)}
.savebar b{color:var(--ink)}
.savebar .warn{color:var(--ko);font-weight:600}
nav.tabs{max-width:1000px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.setbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.setbar .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:92px}
.setbar .btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2);font-weight:600}
.setbar .btn small{font-weight:400;color:var(--mut);font-size:.72rem}
.setbar .mini-bar{width:100%;height:4px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.mini-bar i{display:block;height:100%}
.mini-bar .g{background:var(--ok)}.mini-bar .o{background:var(--ko)}
h2{margin:0 0 4px;font-size:1.2rem}
.src{color:var(--mut);font-size:.85rem}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 8px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:.82rem}
.chipbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
html[data-theme=dark] .chipbtn.on{color:#06201d}
.prog{margin-top:10px;font-size:.85rem;color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin-top:4px}
.bar i{display:block;height:100%}.bar .g{background:var(--ok)}.bar .o{background:var(--ko)}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.q[data-status=ok]{border-left-color:var(--ok)}.q[data-status=ko]{border-left-color:var(--ko)}
.q.hide{display:none}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;font-size:.78rem}
.num{background:var(--acc);color:#fff;border-radius:7px;padding:1px 8px;font-weight:700}
html[data-theme=dark] .num{color:#06201d}
.chip{border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--mut)}
.chip.th{background:var(--accbg);color:var(--acc2);border-color:transparent}
.st{margin-left:auto;font-weight:600}
.qt{font-weight:600;margin-bottom:8px}
.note{font-size:.8rem;color:var(--ko);background:var(--kobg);border-radius:8px;padding:5px 9px;margin:6px 0}
.hint{font-size:.8rem;color:var(--mut);margin-bottom:5px}
textarea.ta{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);resize:vertical;min-height:70px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--acc)}
.opt input{margin-top:5px}
.ltr{font-weight:700;color:var(--mut);min-width:1.1em}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.missed{border:2px dashed var(--ok)}
.vf{width:100%;border-collapse:collapse}
.vf td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.vf td.r{white-space:nowrap;text-align:right}
.vf label{margin-left:8px;cursor:pointer}
.vf tr.good td:first-child{box-shadow:inset 4px 0 var(--ok)}.vf tr.bad td:first-child{box-shadow:inset 4px 0 var(--bad)}
.vf .why{display:block;font-size:.82rem;margin-top:3px;color:var(--mut)}
.vf tr.bad .why{color:var(--bad)}
.legend{margin:0 0 8px;padding-left:0;list-style:none;display:grid;gap:3px;font-size:.9rem}
.legend b{display:inline-block;min-width:1.5em;color:var(--acc2)}
.rows{display:grid;gap:6px}
.row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--bg)}
.row .lab{flex:1}
.row.good{background:var(--okbg);border-color:var(--ok)}.row.bad{background:var(--badbg);border-color:var(--bad)}
select.s,input.n{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--card);max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
.tbl th{background:var(--accbg);color:var(--acc2)}
.tbl td.good{background:var(--okbg)}.tbl td.bad{background:var(--badbg)}
.tbl select{width:100%}
.tbl .fix{display:block;font-size:.78rem;color:var(--ok);margin-top:2px}
.tblwrap{overflow-x:auto}
table.mini{border-collapse:collapse;margin:6px 0}table.mini th,table.mini td{border:1px solid var(--line);padding:4px 10px}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.qr{margin-top:10px;border-radius:10px;padding:10px 12px;background:var(--accbg);border:1px solid transparent}
.qr.okr{background:var(--okbg);border-color:var(--ok)}.qr.kor{background:var(--badbg);border-color:var(--bad)}
.qr .verdict{font-weight:700;margin-bottom:3px}
.qr ul,.qr ol{margin:.3em 0;padding-left:1.3em}
.qs{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
img.qimg{max-height:220px;border-radius:8px;border:1px solid var(--line);display:block;margin:6px 0}
svg.fig{width:100%;max-width:600px;height:auto;display:block;margin:8px 0;color:var(--ink)}
svg.fig .ax{stroke:var(--mut);stroke-width:1.4;fill:none}
svg.fig .dash{stroke:var(--mut);stroke-dasharray:4 3;stroke-width:1;fill:none}
svg.fig .dbl{stroke:var(--ink);stroke-width:1.5}
svg.fig .c1{stroke:var(--c1);stroke-width:2.4}svg.fig .c2{stroke:var(--c2);stroke-width:2.4}
svg.fig .k1{fill:var(--c1)}svg.fig .k2{fill:var(--c2)}
svg.fig .sm{font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--accbg);stroke-width:3px;stroke-linejoin:round}svg.fig .mk0{fill:var(--ink)}svg.fig .mk1{fill:var(--c1)}svg.fig .mk2{fill:var(--c2)}svg.fig .tt{font-size:12px;font-weight:700;fill:var(--ink)}
svg.fig .arr{stroke:var(--c1);color:var(--c1)}svg.fig .arr2{stroke:var(--c2);color:var(--c2)}
svg.fig .rf{fill:var(--c2)}svg.fig .gz{fill:#6aa7ff;stroke:var(--c1)}svg.fig .gy{fill:#c79bff;stroke:#7c3aed}svg.fig .gx{fill:#b9c2cc;stroke:var(--mut)}
/* flashcards */
.fc-ctrl{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fc-stats{font-size:.85rem;color:var(--mut)}
.fc-stage{perspective:1400px;margin:12px 0}
.fcard{display:grid;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;min-height:240px}
.fcard.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;justify-content:center}
.face.back{transform:rotateY(180deg);background:var(--accbg)}
.face .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.face .big{font-size:1.2rem;font-weight:600}
.face .ans{font-size:1.05rem}
.face .ans ul,.face .ans ol{margin:.3em 0;padding-left:1.3em}
.face .tap{margin-top:auto;font-size:.78rem;color:var(--mut)}
.fc-st{position:absolute;top:10px;right:14px;font-size:.8rem;font-weight:700}
.fcwrap{position:relative}
.fc-act{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fc-act .btn{padding:9px 18px;font-size:.98rem}
.fc-nav{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;font-size:.9rem}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.strip i{width:13px;height:13px;border-radius:3px;background:var(--line);cursor:pointer;display:block}
.strip i.su{background:var(--ok)}.strip i.rev{background:var(--ko)}.strip i.cur{outline:2px solid var(--acc);outline-offset:1px}
.kbd{font-size:.75rem;color:var(--mut);text-align:center;margin-top:6px}
.empty{padding:24px;text-align:center;color:var(--mut)}
table.bil{width:100%;border-collapse:collapse;font-size:.9rem}
table.bil th,table.bil td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.bil td.n{text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw}
.linklist{display:grid;gap:4px;margin:6px 0 0;padding:0;list-style:none}
.linklist button{all:unset;cursor:pointer;color:var(--acc2);text-decoration:underline;font-size:.88rem}
@media (max-width:560px){header.top{position:static}main{padding:8px}.panel{padding:10px}.fc-act .btn{flex:1}}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">UE 3.3 · Physique appliquée & technologie en remnographie<small>TD interactifs · TD alternatifs · Flashcards — MERM</small></div>
    <div class="tools">
      <button class="btn pri" id="exp" title="Télécharger votre progression dans un fichier .json">💾 Exporter</button>
      <button class="btn" id="imp" title="Recharger une sauvegarde .json">📂 Importer</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
      <button class="btn" id="dark" title="Mode clair / sombre">🌓</button>
      <button class="btn sm" id="rstall">Tout effacer</button>
    </div>
    <div class="savebar" id="savebar"></div>
  </div>
  <nav class="tabs">
    <button data-tab="td">📝 TD</button>
    <button data-tab="alt">🔀 TD alternatifs</button>
    <button data-tab="fc">🃏 Flashcards</button>
    <button data-tab="bil">📊 Bilan</button>
  </nav>
</header>
<main id="main"></main>
<script>
/* ===== Schémas SVG (redessinés d'après les TD) ===== */
const FIG = {};
(function () {
  const ax = (x0, y0, w, h, lx, ly) =>
    `<line class="ax" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 - h}"/><line class="ax" x1="${x0}" y1="${y0}" x2="${x0 + w}" y2="${y0}"/>` +
    `<text x="${x0 + w}" y="${y0 + 14}" text-anchor="end" class="sm">${lx}</text><text x="${x0 - 6}" y="${y0 - h + 4}" text-anchor="end" class="sm">${ly}</text>`;
  const curve = (x0, y0, w, h, f, cls, n = 60) => {
    let d = '';
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      d += (i ? 'L' : 'M') + (x0 + t * w).toFixed(1) + ' ' + (y0 - f(t) * h).toFixed(1);
    }
    return `<path d="${d}" class="${cls}" fill="none"/>`;
  };

  FIG.relax = () => {
    const w = 190, h = 110;
    // T1 : repousse ; T2 : décroissance (constante de temps = 0.3 en unité normalisée)
    const T = 0.3;
    const l = 40, r = 300, y = 140;
    return `<svg viewBox="0 0 560 190" class="fig" role="img" aria-label="Courbes de relaxation T1 et T2">
      <text x="135" y="14" text-anchor="middle" class="tt">Relaxation longitudinale (T1)</text>
      ${ax(l, y, w + 30, h + 5, 'temps', 'Mz')}
      <line class="dash" x1="${l}" y1="${y - h}" x2="${l + w + 30}" y2="${y - h}"/><text x="${l - 6}" y="${y - h + 12}" text-anchor="end" class="sm">M0</text>
      ${curve(l, y, w, h, t => 1 - Math.exp(-t / T), 'c1')}
      <line class="dash" x1="${l}" y1="${y - 0.63 * h}" x2="${l + T * w}" y2="${y - 0.63 * h}"/>
      <line class="dash" x1="${l + T * w}" y1="${y - 0.63 * h}" x2="${l + T * w}" y2="${y}"/>
      <text x="${l + T * w}" y="${y + 14}" text-anchor="middle" class="sm">T1</text>
      <text x="${l + T * w + 8}" y="${y - 0.63 * h - 4}" class="sm">63 % de M0</text>
      <text x="415" y="14" text-anchor="middle" class="tt">Relaxation transversale (T2)</text>
      ${ax(330, y, w + 30, h + 5, 'temps', 'Mxy')}
      ${curve(330, y, w, h, t => Math.exp(-t / T), 'c2')}
      <line class="dash" x1="330" y1="${y - 0.37 * h}" x2="${330 + T * w}" y2="${y - 0.37 * h}"/>
      <line class="dash" x1="${330 + T * w}" y1="${y - 0.37 * h}" x2="${330 + T * w}" y2="${y}"/>
      <text x="${330 + T * w}" y="${y + 14}" text-anchor="middle" class="sm">T2</text>
      <text x="${330 + T * w + 8}" y="${y - 0.37 * h - 6}" class="sm">37 % de la valeur initiale</text>
    </svg>`;
  };

  const MK = `<defs><marker id="mk0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="mk0" d="M0 0L10 5L0 10z"/></marker><marker id="mk1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="mk1" d="M0 0L10 5L0 10z"/></marker><marker id="mk2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="mk2" d="M0 0L10 5L0 10z"/></marker></defs>`;
  FIG.pol = () => `<svg viewBox="0 0 560 210" class="fig" role="img" aria-label="Spins hors champ et sous champ B0">
    ${MK}
    <text x="130" y="16" text-anchor="middle" class="tt">Hors champ : M = 0</text>
    <g stroke="var(--ink)" stroke-width="2" marker-end="url(#mk0)">
      ${[0, 40, 80, 125, 170, 215, 255, 300, 340].map((a, i) => {
        const cx = 55 + (i % 3) * 75, cy = 60 + Math.floor(i / 3) * 50, L = 24, r = a * Math.PI / 180;
        return `<line x1="${cx - Math.cos(r) * L / 2}" y1="${cy + Math.sin(r) * L / 2}" x2="${cx + Math.cos(r) * L / 2}" y2="${cy - Math.sin(r) * L / 2}"/>`;
      }).join('')}
    </g>
    <text x="420" y="16" text-anchor="middle" class="tt">Sous B0 : polarisation (Boltzmann)</text>
    <line x1="330" y1="200" x2="330" y2="30" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk0)"/><text x="338" y="36" class="sm">B0 (z)</text>
    <g stroke="var(--c1)" stroke-width="2" marker-end="url(#mk1)">
      ${[0, 1, 2, 3, 4, 5].map(i => `<line x1="${370 + i * 26}" y1="125" x2="${370 + i * 26}" y2="80"/>`).join('')}
    </g>
    <g stroke="var(--c2)" stroke-width="2" marker-end="url(#mk2)">
      <line x1="383" y1="140" x2="383" y2="185"/><line x1="435" y1="140" x2="435" y2="185"/>
    </g>
    <text x="440" y="70" text-anchor="middle" class="sm">parallèles (basse énergie) : excès</text>
    <text x="440" y="203" text-anchor="middle" class="sm">antiparallèles (haute énergie)</text>
    <text x="545" y="108" text-anchor="end" class="sm">M ≠ 0</text>
  </svg>`;

  FIG.chrono = () => {
    const x0 = 100, ex = 356, rows = { rf: 52, sig: 100, gz: 150, gy: 195, gx: 240 };
    const L = (t, y) => `<text x="${x0 - 8}" y="${y}" text-anchor="end" class="sm">${t}</text><line class="ax" x1="${x0}" y1="${y}" x2="520" y2="${y}"/>`;
    let echo = '';
    for (let i = -40; i <= 40; i += 2) {
      const a = Math.exp(-Math.pow(i / 18, 2)) * 22 * Math.cos(i * 0.9);
      echo += (i === -40 ? 'M' : 'L') + (ex + i).toFixed(1) + ' ' + (rows.sig - a).toFixed(1);
    }
    return `<svg viewBox="0 0 560 290" class="fig" role="img" aria-label="Chronogramme d'une séquence spin écho">
      <defs><marker id="mk0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="mk0" d="M0 0L10 5L0 10z"/></marker></defs>
      ${L('RF', rows.rf)}${L('Signal', rows.sig)}${L('Gz (coupe)', rows.gz)}${L('Gy (phase)', rows.gy)}${L('Gx (lecture)', rows.gx)}
      <rect x="${x0 + 50}" y="${rows.rf - 18}" width="8" height="18" class="rf"/><text x="${x0 + 54}" y="${rows.rf - 22}" text-anchor="middle" class="sm">90°</text>
      <rect x="${x0 + 150}" y="${rows.rf - 30}" width="10" height="30" class="rf"/><text x="${x0 + 155}" y="${rows.rf - 34}" text-anchor="middle" class="sm">180°</text>
      <path d="${echo}" class="c1" fill="none"/><text x="${ex + 50}" y="${rows.sig - 14}" class="sm">écho</text>
      <rect x="${x0 + 44}" y="${rows.gz - 18}" width="20" height="18" class="gz"/><rect x="${x0 + 143}" y="${rows.gz - 18}" width="24" height="18" class="gz"/>
      <rect x="${x0 + 85}" y="${rows.gy - 18}" width="26" height="18" class="gy"/>
      <rect x="${ex - 40}" y="${rows.gx - 18}" width="80" height="18" class="gx"/>
      <line class="dash" x1="${x0 + 54}" y1="26" x2="${x0 + 54}" y2="${rows.gx}"/>
      <line class="dash" x1="${x0 + 155}" y1="26" x2="${x0 + 155}" y2="${rows.gx}"/>
      <line class="dash" x1="${ex}" y1="26" x2="${ex}" y2="${rows.gx}"/>
      <line x1="${x0 + 54}" y1="266" x2="${ex}" y2="266" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk0)"/>
      <text x="${(x0 + 54 + ex) / 2}" y="282" text-anchor="middle" class="sm">TE</text>
    </svg>`;
  };

  const twoTissues = (type) => {
    const l = 50, y = 150, w = 300, h = 110;
    const grow = T => t => 1 - Math.exp(-t / T);
    const decay = T => t => Math.exp(-t / T);
    const f1 = type === 'T1' ? grow(0.18) : decay(0.30), f2 = type === 'T1' ? grow(0.45) : decay(0.55);
    const p1 = type === 'T1' ? 0.22 : 0.20, p2 = type === 'T1' ? 0.80 : 0.62;
    const n = type === 'T1' ? 'TR' : 'TE';
    const vl = (p, f1, f2, lab, txt) => `<line class="dash" x1="${l + p * w}" y1="${y + 6}" x2="${l + p * w}" y2="${y - h - 5}"/>
      <text x="${l + p * w}" y="${y + 20}" text-anchor="middle" class="sm">${lab}</text>

    </svg>`;

  /* --- Physique de base --- */
  [TH.phy, 'Qu’est-ce que le spin ?', 'Paramètre physique de toute particule chargée : <b>rotation de la particule sur elle-même</b>, qui induit un moment magnétique.'],
  [TH.phy, 'Qu’est-ce que le moment magnétique ?', 'Grandeur vectorielle notée µ qui mesure l’intensité d’une source magnétique (comportement de boussole).'],
  [TH.phy, 'Qu’est-ce que le rapport gyromagnétique γ ?', 'Rapport du moment magnétique d’une particule à son spin (µ proportionnel à γ).'],
  [TH.phy, 'Quels noyaux possèdent un moment magnétique nucléaire ?', 'Ceux ayant un nombre <b>impair</b> de protons et/ou de neutrons (proton isolé). Si le nombre est pair, les moments s’annulent deux à deux (ex. ¹²C : pas de moment).'],
  [TH.phy, 'Quels sont les 2 constituants du corps utiles au signal RMN ?', 'L’<b>eau (H₂O)</b> et la <b>graisse</b> (ramifications CH₃).'],
  [TH.phy, 'Comportement des spins hors champ magnétique ?', 'Moments orientés dans toutes les directions : somme nulle, <b>M = 0</b> (pas d’aimantation macroscopique).', 'pol'],
  [TH.phy, 'Comportement des spins sous B0 ?', 'Alignement dans l’axe de B0 en 2 populations (<b>parallèle</b> / <b>antiparallèle</b>) avec un petit excès parallèle (basse énergie) → <b>M ≠ 0</b>.', 'pol'],
  [TH.phy, 'Qu’est-ce que la polarisation ?', 'Établissement de l’état d’équilibre de <b>Boltzmann</b> sous B0 (excès de spins parallèles, M ≠ 0). Créée par l’aimant.'],
  [TH.phy, 'Quelles sont les 2 composantes de M ?', '<b>Mz</b> : aimantation longitudinale (projection sur B0, axe Oz). <b>Mxy</b> : aimantation transversale (projection dans le plan xOy).'],
  [TH.phy, 'Qu’est-ce que la précession ?', 'Rotation du moment magnétique µ autour de l’axe de B0 à la fréquence de <b>Larmor</b> (mouvement de toupie).'],
  [TH.phy, 'Équation de Larmor ?', '<b>ω₀ = γ · B0</b> : la fréquence de précession dépend de B0 et de γ.'],
  [TH.phy, 'Quelles sont les 3 grandes étapes d’une acquisition IRM ?', '<b>Polarisation → Excitation → Relaxation</b> (longitudinale et transversale).'],
  [TH.phy, 'Définition de la résonance ?', 'Échange d’énergie entre 2 systèmes de <b>même fréquence</b>. En IRM : onde RF ↔ spins en précession.'],
  [TH.phy, 'Condition de résonance en IRM ?', '<b>ωr = ω₀ = γ·B0</b> : la fréquence de l’onde RF doit être égale à la fréquence de Larmor. Sinon, pas de phénomène RMN.'],
  [TH.phy, 'Unité du champ magnétique ?', 'Le <b>Tesla (T)</b>.'],

  /* --- Excitation & relaxation --- */
  [TH.rel, 'Valeurs de Mz et Mxy à l’équilibre thermodynamique ?', '<b>Mz maximale</b> (M0), <b>Mxy = 0</b> (spins déphasés).'],
  [TH.rel, 'Valeurs de Mz et Mxy après une impulsion RF de 90° ?', '<b>Mz = 0</b> (populations égalisées), <b>Mxy maximale</b> (spins en phase). Phase d’<b>excitation</b>.'],
  [TH.rel, 'Que fait une impulsion RF de 180° ?', 'Inverse Mz : <b>M = −Mz</b> (maximale mais de sens opposé à B0).'],
  [TH.rel, 'Direction de B1 par rapport à B0 ?', 'Toujours <b>perpendiculaire</b> à B0.'],
  [TH.rel, 'Conséquences du pulse RF (B1) ?', 'Transition des moments vers l’état de haute énergie ; mise en phase des spins ; inclinaison de M par rapport à B0.'],
  [TH.rel, 'Répartition des populations à l’équilibre puis après 90° ?', 'Équilibre : majorité de spins parallèles (basse énergie) — <b>polarisation</b>. Après 90° : populations égalisées — <b>excitation</b>.'],
  [TH.rel, 'Quel phénomène suit l’arrêt de l’onde RF ?', 'La <b>relaxation</b> : retour à l’équilibre ; l’énergie restituée par les spins est la source du signal RMN.'],
  [TH.rel, 'Relaxation longitudinale : nom, constante, évolution ?', '<b>Spin-réseau</b>, constante <b>T1</b> : repousse exponentielle de Mz jusqu’à M0. Base du contraste T1.', 'relax'],
  [TH.rel, 'Relaxation transversale : nom, constante, évolution ?', '<b>Spin-spin</b>, constante <b>T2</b> : décroissance exponentielle de Mxy (perte de cohérence de phase), sans échange d’énergie.', 'relax'],
  [TH.rel, 'Définition du T1 ?', 'Temps nécessaire à Mz pour retrouver <b>63 %</b> de sa valeur initiale.'],
  [TH.rel, 'Définition du T2 ?', 'Constante de décroissance de Mxy (<b>37 %</b> de la valeur initiale).'],
  [TH.rel, 'Quelle relaxation est la plus rapide ?', 'La relaxation <b>transversale</b>.'],
  [TH.rel, 'T1 et T2 dépendent-ils de B0 ?', 'Le T2 peut être considéré comme <b>indépendant de B0</b>, contrairement au T1.'],
  [TH.rel, 'T2* vs T2 ?', 'Le T2* traduit les déphasages dus aux inhomogénéités <b>intrinsèques</b> (tissus) ET <b>extrinsèques</b> (B0). Le T2 « vrai » s’obtient avec un 180° de rephasage.'],
  [TH.rel, 'Comment obtenir un T2 « vrai » ?', 'Ajouter une impulsion RF de <b>180°</b> après le 90° (rephasage compensateur → écho de spin) : séquence <b>écho de spin</b>.'],
  [TH.rel, 'Étapes d’obtention du signal / contraste ?', '<ol><li>RF : Mz disparaît</li><li>Apparition de Mxy (rephasage)</li><li>Arrêt de la RF</li><li>Repousse de Mz (T1)</li><li>Mesure de Mxy par l’antenne = signal</li></ol>'],

  /* --- Pondération & contraste --- */
  [TH.pon, 'Qu’est-ce que le contraste en IRM ?', 'Différence d’intensité de signal émis par les structures lors de la relaxation transversale.'],
  [TH.pon, 'Quels paramètres influencent le contraste ?', 'Le <b>TR</b>, le <b>TE</b> et l’<b>angle de bascule</b>.'],
  [TH.pon, 'Qu’est-ce que le TR et quelle pondération conditionne-t-il ?', 'Temps de répétition : intervalle entre 2 excitations. Il conditionne la pondération <b>T1</b>.', 'contrastT1'],
  [TH.pon, 'Qu’est-ce que le TE et quelle pondération conditionne-t-il ?', 'Temps d’écho : temps de récupération du signal. Il conditionne la pondération <b>T2</b>.', 'contrastT2'],
  [TH.pon, 'Réglages TR/TE pour une pondération T1 ?', '<b>TR court</b> (max 700 ms) et <b>TE court</b> (max 50 ms).'],
  [TH.pon, 'Réglages TR/TE pour une pondération T2 ?', '<b>TR long</b> (&gt; 1800 ms) et <b>TE long</b> (80–120 ms).'],
  [TH.pon, 'Réglages TR/TE pour une pondération en densité de protons ?', '<b>TR long</b> et <b>TE court</b>.'],
  [TH.pon, 'Rôle du TE court et du TR court pour pondérer en T1 ?', 'TE court : ne pas pondérer en T2. TR court : pondérer en T1.'],
  [TH.pon, 'Rôle du TE long et du TR long pour pondérer en T2 ?', 'TE long : exprimer les contrastes T2. TR long : s’affranchir des contrastes T1.'],
  [TH.pon, 'Signal d’un tissu à T1 court / T1 long en pondération T1 ?', 'T1 court → <b>hypersignal</b> ; T1 long → <b>hyposignal</b>.'],
  [TH.pon, 'Signal d’un tissu à T2 court / T2 long en pondération T2 ?', 'T2 court → <b>hyposignal</b> ; T2 long → <b>hypersignal</b>.'],
  [TH.pon, 'Signal en pondération densité de protons ?', 'Grande densité de protons → hypersignal ; petite densité → hyposignal.'],
  [TH.pon, 'Données T1/T2 de l’eau, de la graisse et de l’os ?', '<b>Eau</b> : T1 long / T2 long. <b>Graisse</b> : T1 court / T2 court. <b>Os</b> : T1 long / T2 court.'],
  [TH.pon, 'Signal de l’eau, de l’os et de la graisse en spin écho T1 et T2 ?', '<b>Eau</b> : hypo T1 / hyper T2. <b>Os</b> : hypo / hypo. <b>Graisse</b> : hyper / hyper.'],
  [TH.pon, 'Quel tissu est le plus en hypersignal en pondération T1 ?', 'La <b>graisse</b>.'],
  [TH.pon, 'Quelle pondération pour étudier cartilage et ménisques ?', 'La pondération en <b>densité protonique (DP)</b>.'],

  /* --- Qualité d'image & TA --- */
  [TH.qua, 'Quels sont les 5 facteurs de qualité d’une image IRM ?', 'Rapport signal/bruit · contraste · résolution spatiale · temps d’acquisition · présence d’artéfacts.'],
  [TH.qua, 'De quoi dépend le rapport signal/bruit (S/B) ?', 'De la <b>taille du voxel</b>, de la <b>quantité d’eau</b> et des <b>paramètres de la séquence</b>.'],
  [TH.qua, 'Comment obtenir une image de qualité ?', 'Trouver un <b>compromis</b> entre rapport signal/bruit, résolution spatiale et durée d’acquisition.'],
  [TH.qua, 'Formule du temps d’acquisition ?', '<b>TA = TR · Np · Nex</b>'],
  [TH.qua, 'Que représentent Np et Nex ?', '<b>Np</b> : nombre de lignes de la matrice (nombre de phases). <b>Nex</b> : nombre d’excitations = nombre de répétitions pour accumuler du signal → meilleur RSB.'],
  [TH.qua, 'Effet d’une augmentation de Nex ?', 'Meilleur RSB, mais temps d’acquisition plus long (TA ∝ Nex).'],

  /* --- Codage spatial & espace K --- */
  [TH.cod, 'Quels sont les 2 outils du codage spatial ?', 'Outil <b>physique</b> : le gradient de champ magnétique. Outil <b>mathématique</b> : la transformée de Fourier.'],
  [TH.cod, 'Objectif de la transformée de Fourier ?', 'Passer du domaine <b>temporel</b> (amplitude/temps) au domaine <b>fréquentiel</b> (amplitude/fréquence).'],
  [TH.cod, 'Définition d’un gradient de champ magnétique ?', 'Champ de <b>faible intensité</b>, variant <b>linéairement</b> dans l’espace, qui s’ajoute à B0 de manière contrôlée dans le temps.'],
  [TH.cod, 'Rôle d’un gradient ?', 'Sélectionner un plan de coupe (d’où vient le signal ?) et coder le signal dans la coupe.'],
  [TH.cod, 'Conséquences d’un gradient sur les spins ?', 'Modification de leur <b>fréquence de précession</b> et de leur <b>phase</b>.'],
  [TH.cod, 'Gradient Gz ?', '<b>Gradient de coupe</b> : sélection d’une coupe ; appliqué en même temps que l’onde RF.', 'chrono'],
  [TH.cod, 'Gradient Gy ?', '<b>Gradient de codage de phase</b> : sélectionne la ligne du plan de Fourier ; appliqué avant la réception du signal.', 'chrono'],
  [TH.cod, 'Gradient Gx ?', '<b>Gradient de lecture (fréquence)</b> : codage par la fréquence, remplit les lignes du plan de Fourier ; appliqué pendant la réception.', 'chrono'],
  [TH.cod, 'Orientation relative des gradients ?', 'Tous les gradients sont <b>perpendiculaires</b> entre eux.'],
  [TH.cod, 'Qu’est-ce que l’espace K ?', 'Espace mathématique où est stocké le signal enregistré ; il correspond exactement à un <b>plan de Fourier</b> (lignes et colonnes).'],
  [TH.cod, 'Que contient le centre de l’espace K ?', 'Les signaux les <b>plus élevés</b> = basses fréquences → détermine le <b>contraste</b>.', 'kspace'],
  [TH.cod, 'Que contient la périphérie de l’espace K ?', 'Les signaux les plus faibles = hautes fréquences → détermine la <b>résolution spatiale</b> (détails).', 'kspace'],
  [TH.cod, 'Lien entre un point de l’espace K et l’image ?', 'Chaque point de l’espace K contribue à tous les points de l’espace image, et inversement.'],
  [TH.cod, 'Chronogramme d’une séquence spin écho avec gradients ?', 'RF : 90° puis 180° ; Gz pendant les impulsions RF ; Gy entre le 90° et la lecture ; Gx pendant l’écho.', 'chrono'],

  /* --- Séquences --- */
  [TH.seq, 'Quels sont les 6 grands types de séquences ?', 'Spin écho · Écho de gradient · Inversion récupération · Suppression de graisse · EPI · ARM (angiographie).'],
  [TH.seq, 'Caractéristiques de la séquence spin écho ?', 'Impulsion de rephasage de <b>180°</b> (compense les hétérogénéités de champ → écho pondéré T2, pas T2*) ; image anatomique de bonne qualité en T1 ; séquences longues.'],
  [TH.seq, 'Caractéristiques de l’écho de gradient (GRE) ?', 'Angle de bascule <b>&lt; 90°</b> ; séquence rapide (proche de la seconde par coupe) ; sensible aux inhomogénéités (artéfact de susceptibilité) ; T2* ; détecte les dépôts d’hémosidérine.'],
  [TH.seq, 'Caractéristiques de l’inversion récupération ?', 'Impulsion initiale de <b>180°</b> ; modifie les contrastes tissulaires ; STIR (TI court : graisse) et FLAIR (TI long : LCR).'],
  [TH.seq, 'Caractéristiques de la suppression de graisse ?', 'Possible en T1, DP ou T2 ; impulsion sélective centrée sur le pic de la graisse (Fat Sat) ; <b>durée de séquence rallongée</b>.'],
  [TH.seq, 'Caractéristiques de l’EPI ?', 'Séquence la <b>plus rapide</b> (codage très rapide de l’espace K) ; diffusion, perfusion, flux ; étude de la diffusion des molécules d’eau ; pathologie tumorale ; facteur b.'],
  [TH.seq, 'Particularité de l’écho de spin rapide ?', 'Nouvelles impulsions de 180° → <b>train d’échos</b> (facteur turbo / ETL). <b>TA = TR × Np × Nex / ETL</b>.'],
  [TH.seq, 'Séquence STIR : intérêt ?', 'Inversion récupération à <b>TI court</b> : supprime la graisse (ex. rachis lombaire) ; met en évidence les phénomènes inflammatoires ostéo-articulaires.'],
  [TH.seq, 'Séquence FLAIR : intérêt ?', 'Inversion récupération à <b>TI long</b> : supprime le signal du liquide céphalorachidien (LCR).'],
  [TH.seq, 'Principe de la séquence de diffusion ?', 'Étude des mouvements des <b>molécules d’eau</b>. L’<b>ADC</b> confirme une restriction de diffusion ; le <b>facteur b</b> règle la sensibilité au mouvement. Essentielle dans l’AVC aigu.'],
  [TH.seq, 'Quelle séquence met en évidence les flux sans produit de contraste ?', 'L’<b>ARM</b> (angiographie par résonance magnétique). La séquence <b>TOF</b> est sensible à la vitesse des flux.'],
  [TH.seq, 'Quelle séquence est la plus sensible aux artéfacts ?', 'L’<b>écho de gradient</b> : pas d’impulsion de 180° pour corriger l’homogénéité du champ.'],
  [TH.seq, 'Quelle séquence détecte les dépôts d’hémosidérine ?', 'L’<b>écho de gradient (GRE)</b> (saignements, T2*).'],
  [TH.seq, 'Quelle séquence a une impulsion initiale de 180° ?', 'L’<b>inversion récupération</b>.'],
  [TH.seq, 'Quelle séquence donne une image de haute résolution anatomique ?', 'Le <b>spin écho pondéré T1</b>.'],
  [TH.seq, 'Quelle est la séquence la plus rapide ?', 'L’<b>EPI</b>.'],
  [TH.seq, 'Fat Sat spectral : sensibilité ?', 'Sensible aux <b>inhomogénéités de B0</b>.'],
  [TH.seq, 'Sur quelle séquence injecte-t-on le produit de contraste ?', 'Sur une séquence pondérée en <b>T1</b>.'],

  /* --- Artéfacts --- */
  [TH.art, 'Quels types d’artéfacts courants en IRM ?', 'Repliement · mouvements · flux · volume partiel · décalage chimique · métallique · troncature · susceptibilité magnétique.'],
  [TH.art, 'Qu’est-ce qu’un artéfact ?', 'Une image indésirable ou déformée.'],
  [TH.art, 'Artéfact de mouvement : origine et correction ?', 'Respiration, agitation du patient. Correction : séquence en <b>apnée</b>, synchronisation respiratoire (mouvement périodique), explication de l’examen au patient.'],
  [TH.art, 'Artéfact de susceptibilité magnétique : origine, correction, intérêt ?', 'Perte de signal aux interfaces air/tissu, os/tissu, hémoglobine/tissu (inhomogénéité de B0). Correction : séquence spin écho. Intérêt : dépister hémorragies (hémosidérine) et calcifications.'],
  [TH.art, 'Artéfact métallique : origine et correction ?', 'Prothèse de genou, ostéosynthèse… : distorsion locale des lignes de champ. Retirer tout objet métallique ; si métal compatible inévitable, séquences adaptées (écho de spin…).'],
  [TH.art, 'Artéfact de repliement (aliasing) : origine et correction ?', 'FOV inférieur à la zone à examiner. Correction : augmenter le FOV, changer le codage de phase, utiliser des bandes de saturation.'],
  [TH.art, 'Quel artéfact résulte d’une inhomogénéité du champ B0 ?', 'L’artéfact de <b>susceptibilité magnétique</b>.'],
  [TH.art, 'Quel artéfact provoque l’absence de synchronisation des battements cardiaques ?', 'L’artéfact de <b>mouvement</b>.'],

  /* --- Sécurité --- */
  [TH.sec, 'Quels sont les 3 accidents évitables à 100 % ?', 'Brûlures thermiques par les ondes RF · effets projectiles d’objets ferromagnétiques · perte d’audition chez les patients non protégés.'],
  [TH.sec, 'Effets biologiques du champ statique ?', 'Vertiges, nausées, goût métallique.'],
  [TH.sec, 'Effets biologiques des gradients ?', 'Stimulations nerveuses périphériques.'],
  [TH.sec, 'Effets biologiques des ondes RF ?', 'Échauffement des tissus.'],
  [TH.sec, 'Comment éteindre le champ magnétique lors d’un incident ?', '<b>Bouton d’arrêt d’urgence</b> (quench : perte soudaine de la supraconductivité) ou <b>baisse contrôlée</b> en 20 s par un technicien.'],
  [TH.sec, 'Quand activer le quench ?', 'Sujet blessé ou bloqué par un objet métallique enclavé dans l’aimant · incendie dans la salle.'],
  [TH.sec, 'Pourquoi évacuer le patient et fermer la porte après un quench ?', 'L’hélium liquide se vaporise en hélium gazeux : risque d’<b>asphyxie</b> (raréfaction de l’oxygène) et de <b>brûlure par le froid</b>.'],
  [TH.sec, 'Qu’est-ce que le TAS (SAR) ?', 'Énergie déposée par les ondes RF dans les tissus, par unité de temps et de poids. Risque d’échauffement, voire de brûlures graves.'],
  [TH.sec, 'Que faire face à un patient claustrophobe ?', 'Débit d’air suffisant · lumière dans le tunnel · couvrir les yeux / miroirs · communiquer · musique.'],
  [TH.sec, 'Contre-indications absolues à l’IRM ?', 'Matériel électronique implantable (pacemaker, pompes, neurostimulateurs, implant cochléaire) · valves cardiaques anciennes · clips cérébraux anciens · corps étrangers intra-oculaires.'],
  [TH.sec, 'Dispositif métallique de compatibilité inconnue : conduite à tenir ?', 'L’examen n’est <b>pas annulé</b> : vérifier la compatibilité (références exactes) sur <b>securirm.com</b>.'],
  [TH.sec, 'Intérêt du zonage en IRM ?', 'Découper l’espace en <b>4 zones</b> de risques et de restriction d’accès croissants.'],
  [TH.sec, 'Exemples d’objets à risque d’effet projectile ?', 'Stylo à bille, obus d’oxygène, chaise roulante en acier, téléphone portable.'],
  [TH.sec, 'Première étape à l’entrée du patient en salle d’IRM ?', 'L’<b>enlèvement de tout objet métallique</b>.'],
  [TH.sec, 'Pourquoi retirer les objets métalliques ?', 'Garantir une image de qualité, prévenir les brûlures, éviter les déplacements d’objets métalliques.'],
  [TH.sec, 'Quels vêtements pour le patient ?', 'Vêtements <b>ajustés sans métal</b>.'],
  [TH.sec, 'Précautions de contact cutané (brûlures) ?', 'Zones cutanées qui se touchent et jambes croisées favorisent l’échauffement ; protéger du contact direct avec le tunnel par des cales en mousse.'],
  [TH.sec, 'Tatouage : conduite à tenir ?', 'Pas de contre-indication : prévenir le patient du risque d’échauffement et lui donner la poire d’appel.'],
  [TH.sec, 'Pourquoi classer les implants médicaux en IRM ?', 'Pour déterminer leur <b>compatibilité</b> avec l’IRM.'],
  [TH.sec, 'Que signifie « magnéto-protection » ?', 'Protéger les patients contre les champs magnétiques.'],
  [TH.sec, 'Que permet d’éviter la sécurité des implants électroniques ?', 'Les risques d’interférences électromagnétiques.'],

  /* --- Produits de contraste --- */
  [TH.pdc, 'Propriété et action des produits de contraste en IRM ?', '<b>Paramagnétiques</b> : raccourcissent le temps de relaxation des tissus et augmentent le <b>contraste T1</b> là où ils diffusent.'],
  [TH.pdc, 'Dose de produit de contraste ?', '<b>0,2 ml/kg</b>. Une dose trop élevée fait diminuer le signal (effet T2) et dégrade l’image.'],
  [TH.pdc, 'Gadolinium : risques ?', 'Risque de <b>rétention</b> dans le tissu cérébral ; ce sont les produits <b>linéaires</b> qui ont été retirés par les autorités européennes.'],
  [TH.pdc, 'Demi-vie d’élimination du produit de contraste ?', 'De l’ordre de <b>1 h 30</b>.'],
  [TH.pdc, 'Produit de contraste et grossesse ?', 'Contre-indiqué chez la femme enceinte.']
];

  function letter(i) { return String.fromCharCode(65 + i); }

  /* --- ouverte */

  /* --- Association */

  /* --- Tableau */
  function mTable(c) {

      }));

      c.finish(all);

  }
  /* --- Numérique */
  function mNum(c) {

    const run = () => {
      const v = parseFloat($('input', c.body).value.replace(',', '.').replace(/\s/g, ''));

      $('input', c.body).disabled = true; c.el._checked = true; c.act.innerHTML = ''; c.btn('Recommencer', () => { c.el._checked = false; c.res.hidden = true; c.act.innerHTML = ''; mNum(c); setSt(q.id, null); refreshStatus(c.el, q); updateProg(currentSet()); });

  /* --- Remise en ordre */
  function mOrder(c) {

  /* ------------------------------------------------------------------ Flashcards */
  const FC = CARDS.map((c, i) => ({ id: 'fc' + i, th: c[0], q: c[1], a: c[2], fig: c[3] || null }));
  let deck = [], pos = 0, flipped = false, fcKey = '';
  const fcs = id => S.f[id] || null;
  function fcFilter() {
    const f = S.ui.fcF || {}; const th = f.th || [], st = f.st || 'all', qq = (f.q || '').toLowerCase();
    let list = FC.filter(c => (!th.length || th.includes(c.th)) && (st === 'all' || (st === 'new' && !fcs(c.id)) || (st === 'su' && fcs(c.id) === 'su') || (st === 'rev' && fcs(c.id) === 'rev')) && (!qq || (c.q + ' ' + c.a).toLowerCase().includes(qq)));
    if (f.shuf) list = shuffled(list.map(c => c.id), 'fc' + (f.seed || 1)).map(id => FC.find(c => c.id === id));
    return list;
  }
  function rebuildDeck(keepPos) { deck = fcFilter().map(c => c.id); if (!keepPos) pos = 0; if (pos >= deck.length) pos = Math.max(0, deck.length - 1); flipped = false; }
  function renderCards(m) {
    const f = S.ui.fcF = S.ui.fcF || {};
    const key = JSON.stringify([f.th, f.st, f.q, f.shuf, f.seed]);
    { const same = key === fcKey; fcKey = key; rebuildDeck(same); }
    const cnt = { su: 0, rev: 0, nw: 0 }; FC.forEach(c => { const s = fcs(c.id); if (s === 'su') cnt.su++; else if (s === 'rev') cnt.rev++; else cnt.nw++; });

      <div class="chips">${[['all', 'Toutes'], ['rev', '🔁 À revoir (' + cnt.rev + ')'], ['su', '✅ Sues (' + cnt.su + ')'], ['new', 'Non vues (' + cnt.nw + ')']].map(([k, l]) => `<button class="chipbtn${(f.st || 'all') === k ? ' on' : ''}" data-st="${k}">${l}</button>`).join('')}
        <input type="search" id="fcq" placeholder="Rechercher…" value="${esc(f.q || '')}" style="border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--card)">
        <button class="chipbtn${f.shuf ? ' on' : ''}" id="shuf">🔀 Mélanger</button>
        <label class="fc-stats"><input type="checkbox" id="adv" ${f.noadv ? '' : 'checked'}> passer à la suivante après réponse</label></div>

    drawCard();

  function drawCard() {
    const stage = $('#stage'); if (!stage) return;
    if (!deck.length) { stage.innerHTML = '<div class="panel empty">Aucune carte ne correspond à ces filtres.<br>Changez de thème ou de statut.</div>'; return; }
    const c = FC.find(x => x.id === deck[pos]), s = fcs(c.id);
    const stl = s === 'su' ? '✅ Sue' : s === 'rev' ? '🔁 À revoir' : '';
    stage.innerHTML = `<div class="fc-stage fcwrap"><span class="fc-st">${stl}</span>
      <div class="fcard${flipped ? ' flip' : ''}" id="fcard" tabindex="0" role="button" aria-label="Retourner la carte">
        <div class="face front"><span class="lbl">${esc(c.th)} · question</span><div class="big">${c.q}</div><span class="tap">Cliquer (ou Espace) pour retourner</span></div>
        <div class="face back"><span class="lbl">${esc(c.th)} · réponse</span><div class="ans">${c.a}${c.fig ? FIG[c.fig]() : ''}</div><span class="tap">Cliquer pour revoir la question</span></div>
      </div></div>
      <div class="fc-act"><button class="btn ok" id="su">✅ Je savais</button><button class="btn ko" id="rev">🔁 À revoir</button></div>
      <div class="fc-nav"><button class="btn sm" id="prv">◀ Précédente</button><span>${pos + 1} / ${deck.length}</span><button class="btn sm" id="nxt">Suivante ▶</button></div>
      <div class="strip">${deck.map((id, i) => `<i class="${fcs(id) || ''} ${i === pos ? 'cur' : ''}" data-i="${i}" title="${i + 1}"></i>`).join('')}</div>
      <div class="kbd">Raccourcis : Espace = retourner · S = su · R = à revoir · ← → = naviguer</div>`;
    const card = $('#fcard'); card.onclick = flip;
    $('#su').onclick = () => mark('su'); $('#rev').onclick = () => mark('rev');
    $('#prv').onclick = () => nav(-1); $('#nxt').onclick = () => nav(1);
    $$('.strip i').forEach(i => i.onclick = () => { pos = +i.dataset.i; flipped = false; drawCard(); });
  }
  function flip() { flipped = !flipped; const c = $('#fcard'); if (c) c.classList.toggle('flip', flipped); }
  function nav(d) { if (!deck.length) return; pos = (pos + d + deck.length) % deck.length; flipped = false; drawCard(); }

  }

  /* ------------------------------------------------------------------ init */

    $('#file').onchange = e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
    twoStep($('#rstall'), 'Tout effacer ? Confirmer', () => { S.q = {}; S.f = {}; deck = []; save(); render(); toast('Toute la progression a été effacée.'); });
    $('#dark').onclick = () => { const d = document.documentElement.dataset.theme !== 'dark'; S.ui.dark = d; document.documentElement.dataset.theme = d ? 'dark' : 'light'; save(); };
    window.addEventListener('beforeunload', e => { if (dirty && S.savedAt > S.exportedAt && !storageOK) { e.preventDefault(); e.returnValue = ''; } });
    render();
  }
  init();
})();

</script>
</body>
</html>
